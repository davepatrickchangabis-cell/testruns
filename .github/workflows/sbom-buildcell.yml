{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (9bf24c33861ad43a208d76f0c6e6989963b0fe404a2b7e3f914c08e3ea6d4754, linux-linux_arm64-9bf24c33861ad43a208d76f0c6e6989963b0fe404a2b7e3f914c08e3ea6d4754)",
      "runs-on": "ubuntu-24.04-arm",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "torvalds/linux",
            "ref": "21a7f44fd0765fcc5194130b28767786eba1d1e7",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"fd0caac36e8ce4eb477f0d3aa37655fe94ba09e4\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's fd0caac36e8ce4eb477f0d3aa37655fe94ba09e4\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Install build dependencies",
          "shell": "bash",
          "run": "set -euxo pipefail\nsudo apt-get update\nsudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves libncurses-dev"
        },
        {
          "id": "s2",
          "name": "[recipe] Configure arm64 defconfig",
          "shell": "bash",
          "run": "set -euxo pipefail\nmake O=out ARCH=arm64 defconfig"
        },
        {
          "id": "s3",
          "name": "[recipe] Build kernel Image, modules, and DTBs",
          "shell": "bash",
          "run": "set -euxo pipefail\nmake -j\"$(nproc)\" O=out ARCH=arm64 Image modules dtbs"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"51ec9f73-b1c4-439a-a405-c95d834141de\",\"content_key\":\"9bf24c33861ad43a208d76f0c6e6989963b0fe404a2b7e3f914c08e3ea6d4754\",\"config_name\":\"linux-linux_arm64-9bf24c33861ad43a208d76f0c6e6989963b0fe404a2b7e3f914c08e3ea6d4754\",\"attempt\":1,\"step_ids\":[\"s1\",\"s2\",\"s3\"],\"artifacts\":[\"out/arch/arm64/boot/Image\",\"out/arch/arm64/boot/dts/**/*.dtb\",\"out/**/*.ko\"],\"recipe\":{\"runs_on\":\"ubuntu-24.04-arm\",\"steps\":[{\"name\":\"Install build dependencies\",\"run\":\"set -euxo pipefail\\nsudo apt-get update\\nsudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves libncurses-dev\",\"shell\":\"bash\"},{\"name\":\"Configure arm64 defconfig\",\"run\":\"set -euxo pipefail\\nmake O=out ARCH=arm64 defconfig\",\"shell\":\"bash\"},{\"name\":\"Build kernel Image, modules, and DTBs\",\"run\":\"set -euxo pipefail\\nmake -j\\\"$(nproc)\\\" O=out ARCH=arm64 Image modules dtbs\",\"shell\":\"bash\"}],\"artifacts\":[\"out/arch/arm64/boot/Image\",\"out/arch/arm64/boot/dts/**/*.dtb\",\"out/**/*.ko\"],\"citations\":{\"steps\":\"arch/arm64/configs/defconfig\"},\"notes\":\"Builds the Linux kernel natively for arm64 using the provided defconfig and emits the Image, DTBs, and module .ko files.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-9bf24c33861ad43a208d76f0c6e6989963b0fe404a2b7e3f914c08e3ea6d4754",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
