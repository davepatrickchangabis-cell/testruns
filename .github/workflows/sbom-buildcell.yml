{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (b35ed6c42c8c44490b301ce20c451ddc1d6513d3f96b518edb1c7ad64dd9eb66, paperless-ngx-linux_amd64-b35ed6c42c8c44490b301ce20c451ddc1d6513d3f96b518edb1c7ad64dd9eb66)",
      "runs-on": "ubuntu-26.04",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "paperless-ngx/paperless-ngx",
            "ref": "19fdc3b815cdcaf0ad869557c45c27ef7d2215b3",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"990be9abe310a01a54ea2d13779aa74a3eef4529\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's 990be9abe310a01a54ea2d13779aa74a3eef4529\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Set up Docker Buildx",
          "uses": "docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069"
        },
        {
          "id": "s2",
          "name": "[recipe] Maximize space",
          "shell": "bash",
          "run": "sudo rm -rf /usr/share/dotnet\nsudo rm -rf /opt/ghc\nsudo rm -rf /usr/local/share/boost\nsudo rm -rf \"$AGENT_TOOLSDIRECTORY\""
        },
        {
          "id": "s3",
          "name": "[recipe] Build and push by digest",
          "uses": "docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc",
          "with": {
            "file": "./Dockerfile",
            "context": ".",
            "platforms": "linux/amd64"
          }
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"7d75fc0a-c02f-4018-ac1f-5ca4ed76f4f9\",\"content_key\":\"b35ed6c42c8c44490b301ce20c451ddc1d6513d3f96b518edb1c7ad64dd9eb66\",\"config_name\":\"paperless-ngx-linux_amd64-b35ed6c42c8c44490b301ce20c451ddc1d6513d3f96b518edb1c7ad64dd9eb66\",\"attempt\":2,\"step_ids\":[\"s1\",\"s2\",\"s3\"],\"artifacts\":[\"tmp/digests/digest-amd64.txt\"],\"recipe\":{\"runs_on\":\"ubuntu-26.04\",\"steps\":[{\"name\":\"Set up Docker Buildx\",\"uses\":\"docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069\"},{\"name\":\"Maximize space\",\"run\":\"sudo rm -rf /usr/share/dotnet\\nsudo rm -rf /opt/ghc\\nsudo rm -rf /usr/local/share/boost\\nsudo rm -rf \\\"$AGENT_TOOLSDIRECTORY\\\"\",\"shell\":\"bash\"},{\"name\":\"Build and push by digest\",\"uses\":\"docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc\",\"with\":{\"file\":\"./Dockerfile\",\"context\":\".\",\"platforms\":\"linux/amd64\"}}],\"artifacts\":[\"tmp/digests/digest-amd64.txt\"],\"citations\":{\"steps\":\".github/workflows/ci-docker.yml\"},\"notes\":\"Builds the Docker image for linux/amd64 with Buildx on Ubuntu 26.04; publishing and artifact upload are not included.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-b35ed6c42c8c44490b301ce20c451ddc1d6513d3f96b518edb1c7ad64dd9eb66",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
