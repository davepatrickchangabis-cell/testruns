{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (9987c07d7fd487e77096f304cdc49655ee01492b46ba17bea891b7c12bdf3997, runtime-linux_arm64_glibc-9987c07d7fd487e77096f304cdc49655ee01492b46ba17bea891b7c12bdf3997)",
      "runs-on": "ubuntu-24.04-arm",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "dotnet/runtime",
            "ref": "699100ec729dddc77dcafa770b3b9e177357ec41",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"17719c8391be75a3aaf11a2ab302374e00ba03b6\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's 17719c8391be75a3aaf11a2ab302374e00ba03b6\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Install Kerberos development package",
          "shell": "bash",
          "run": "sudo apt-get update && sudo apt-get install -y libkrb5-dev"
        },
        {
          "id": "s2",
          "name": "[recipe] Build clr+libs+host+packs (linux-arm64, libs Debug, CI)",
          "shell": "bash",
          "run": "./build.sh -ci -os linux -arch arm64 -s clr+libs+host+packs -rc Release -c Release -lc Debug"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"e7974b9a-0ee6-4753-9fbe-d34ea5cb44a7\",\"content_key\":\"9987c07d7fd487e77096f304cdc49655ee01492b46ba17bea891b7c12bdf3997\",\"config_name\":\"runtime-linux_arm64_glibc-9987c07d7fd487e77096f304cdc49655ee01492b46ba17bea891b7c12bdf3997\",\"attempt\":3,\"step_ids\":[\"s1\",\"s2\"],\"artifacts\":[\"artifacts/bin/**\",\"artifacts/packages/**\"],\"recipe\":{\"runs_on\":\"ubuntu-24.04-arm\",\"steps\":[{\"name\":\"Install Kerberos development package\",\"run\":\"sudo apt-get update && sudo apt-get install -y libkrb5-dev\",\"shell\":\"bash\"},{\"name\":\"Build clr+libs+host+packs (linux-arm64, libs Debug, CI)\",\"run\":\"./build.sh -ci -os linux -arch arm64 -s clr+libs+host+packs -rc Release -c Release -lc Debug\",\"shell\":\"bash\"}],\"artifacts\":[\"artifacts/bin/**\",\"artifacts/packages/**\"],\"citations\":{\"steps\":\"eng/pipelines/runtime.yml\"},\"notes\":\"Reproduces the linux-arm64 AllSubsets_CoreCLR build (coreclr) with libraries in Debug using CI mode.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-9987c07d7fd487e77096f304cdc49655ee01492b46ba17bea891b7c12bdf3997",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
