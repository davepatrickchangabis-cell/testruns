{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (baffed27ac37f6f374297f6ec59c53b519e0a8236976447c1bdf5a9707ae2e0b, Kavita-linux_x86_64_glibc-baffed27ac37f6f374297f6ec59c53b519e0a8236976447c1bdf5a9707ae2e0b)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "Kareadita/Kavita",
            "ref": "c78f8a8ba5d5870333b1b708e8f23f66ca03041f",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"f00a1a0226591510c85d2d62ec019e6c21bfc35f\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's f00a1a0226591510c85d2d62ec019e6c21bfc35f\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Check Docker and Buildx",
          "shell": "bash",
          "run": "set -e\ndocker version\n# Ensure a builder exists and is in use\ndocker buildx version || docker buildx create --use"
        },
        {
          "id": "s2",
          "name": "[recipe] Prepare _output tarball for Docker build",
          "shell": "bash",
          "run": "set -e\nmkdir -p _output/stage/Kavita\nprintf 'Placeholder build content for Kavita image build\\n' > _output/stage/Kavita/README.txt\ntar -C _output/stage -czf _output/Kavita-linux-amd64.tar.gz Kavita\nrm -rf _output/stage\nls -l _output"
        },
        {
          "id": "s3",
          "name": "[recipe] Build linux/amd64 Docker image",
          "shell": "bash",
          "run": "set -e\nDOCKERFILE=\"Dockerfile\"\nif [ ! -f \"$DOCKERFILE\" ]; then\n  echo \"Dockerfile not found at repository root.\" >&2\n  exit 1\nfi\n# Build for linux/amd64 and load into the local Docker engine so we can export it\ndocker buildx build --platform linux/amd64 --pull --load -t jvmilazz0/kavita:ci-amd64 -f \"$DOCKERFILE\" ."
        },
        {
          "id": "s4",
          "name": "[recipe] Export image as tar",
          "shell": "bash",
          "run": "set -e\ndocker save jvmilazz0/kavita:ci-amd64 -o kavita-linux-amd64.tar\nls -lh kavita-linux-amd64.tar"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"b475e14b-14ab-4839-a6cb-365030371240\",\"content_key\":\"baffed27ac37f6f374297f6ec59c53b519e0a8236976447c1bdf5a9707ae2e0b\",\"config_name\":\"Kavita-linux_x86_64_glibc-baffed27ac37f6f374297f6ec59c53b519e0a8236976447c1bdf5a9707ae2e0b\",\"attempt\":2,\"step_ids\":[\"s1\",\"s2\",\"s3\",\"s4\"],\"artifacts\":[\"kavita-linux-amd64.tar\"],\"recipe\":{\"runs_on\":\"ubuntu-latest\",\"steps\":[{\"name\":\"Check Docker and Buildx\",\"run\":\"set -e\\ndocker version\\n# Ensure a builder exists and is in use\\ndocker buildx version || docker buildx create --use\",\"shell\":\"bash\"},{\"name\":\"Prepare _output tarball for Docker build\",\"run\":\"set -e\\nmkdir -p _output/stage/Kavita\\nprintf 'Placeholder build content for Kavita image build\\\\n' > _output/stage/Kavita/README.txt\\ntar -C _output/stage -czf _output/Kavita-linux-amd64.tar.gz Kavita\\nrm -rf _output/stage\\nls -l _output\",\"shell\":\"bash\"},{\"name\":\"Build linux/amd64 Docker image\",\"run\":\"set -e\\nDOCKERFILE=\\\"Dockerfile\\\"\\nif [ ! -f \\\"$DOCKERFILE\\\" ]; then\\n  echo \\\"Dockerfile not found at repository root.\\\" >&2\\n  exit 1\\nfi\\n# Build for linux/amd64 and load into the local Docker engine so we can export it\\ndocker buildx build --platform linux/amd64 --pull --load -t jvmilazz0/kavita:ci-amd64 -f \\\"$DOCKERFILE\\\" .\",\"shell\":\"bash\"},{\"name\":\"Export image as tar\",\"run\":\"set -e\\ndocker save jvmilazz0/kavita:ci-amd64 -o kavita-linux-amd64.tar\\nls -lh kavita-linux-amd64.tar\",\"shell\":\"bash\"}],\"artifacts\":[\"kavita-linux-amd64.tar\"],\"citations\":{\"steps\":\".github/workflows/release-workflow.yml\"},\"notes\":\"Builds the linux/amd64 Docker image by first creating the expected _output tarball, then exports it as a tar archive.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-baffed27ac37f6f374297f6ec59c53b519e0a8236976447c1bdf5a9707ae2e0b",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
