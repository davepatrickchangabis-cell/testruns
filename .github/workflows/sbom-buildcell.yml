{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (85e81e478e8a93ed19e2d2d5eec2cf5b638d22c267094e2fe620563a2348b64f, libusb-linux_x86_64-85e81e478e8a93ed19e2d2d5eec2cf5b638d22c267094e2fe620563a2348b64f)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "libusb/libusb",
            "ref": "1d8469ec9d55aee43b45a10574f99b43303f70f3",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"0d43d1baeea05caf603a5d6a6050f2f6fd3f8a9e\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's 0d43d1baeea05caf603a5d6a6050f2f6fd3f8a9e\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] setup prerequisites",
          "shell": "bash",
          "run": "sudo apt update\nsudo apt install -y autoconf automake libtool libudev-dev m4 pkg-config clang llvm doxygen"
        },
        {
          "id": "s2",
          "name": "[recipe] bootstrap",
          "shell": "bash",
          "run": "./bootstrap.sh"
        },
        {
          "id": "s3",
          "name": "[recipe] netlink",
          "shell": "bash",
          "run": ".private/ci-build.sh --werror --build-dir build-netlink --no-test -- --disable-udev"
        },
        {
          "id": "s4",
          "name": "[recipe] udev",
          "shell": "bash",
          "run": ".private/ci-build.sh --werror --build-dir build-udev --build-docs -- --enable-udev"
        },
        {
          "id": "s5",
          "name": "[recipe] Release build",
          "shell": "bash",
          "run": "mkdir build-release && cd build-release\n../configure --enable-udev --enable-man-pages\nmake -j$(nproc)\nmake install DESTDIR=\"$PWD/staging\""
        },
        {
          "id": "s6",
          "name": "[recipe] debug-log",
          "shell": "bash",
          "run": ".private/ci-build.sh --werror --build-dir build-debug -- --enable-debug-log"
        },
        {
          "id": "s7",
          "name": "[recipe] disable-log",
          "shell": "bash",
          "run": ".private/ci-build.sh --werror --build-dir build-nolog -- --disable-log"
        },
        {
          "id": "s8",
          "name": "[recipe] setup emsdk",
          "uses": "emscripten-core/setup-emsdk@v16"
        },
        {
          "id": "s9",
          "name": "[recipe] npm install (webusb test shim)",
          "shell": "bash",
          "run": "npm ci",
          "working-directory": "tests/webusb-test-shim"
        },
        {
          "id": "s10",
          "name": "[recipe] emscripten",
          "shell": "bash",
          "run": "emconfigure .private/ci-build.sh --build-dir build-emscripten -- --host=wasm32-unknown-emscripten"
        },
        {
          "id": "s11",
          "name": "[recipe] umockdev test",
          "shell": "bash",
          "run": ".private/ci-container-build.sh docker.io/amd64/ubuntu:rolling"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"3d37e0c3-3bfc-424a-a6a3-5b6d1160f48c\",\"content_key\":\"85e81e478e8a93ed19e2d2d5eec2cf5b638d22c267094e2fe620563a2348b64f\",\"config_name\":\"libusb-linux_x86_64-85e81e478e8a93ed19e2d2d5eec2cf5b638d22c267094e2fe620563a2348b64f\",\"attempt\":2,\"step_ids\":[\"s1\",\"s2\",\"s3\",\"s4\",\"s5\",\"s6\",\"s7\",\"s8\",\"s9\",\"s10\",\"s11\"],\"artifacts\":[\"build-release/staging/**\"],\"recipe\":{\"runs_on\":\"ubuntu-latest\",\"steps\":[{\"name\":\"setup prerequisites\",\"run\":\"sudo apt update\\nsudo apt install -y autoconf automake libtool libudev-dev m4 pkg-config clang llvm doxygen\",\"shell\":\"bash\"},{\"name\":\"bootstrap\",\"run\":\"./bootstrap.sh\",\"shell\":\"bash\"},{\"name\":\"netlink\",\"run\":\".private/ci-build.sh --werror --build-dir build-netlink --no-test -- --disable-udev\",\"shell\":\"bash\"},{\"name\":\"udev\",\"run\":\".private/ci-build.sh --werror --build-dir build-udev --build-docs -- --enable-udev\",\"shell\":\"bash\"},{\"name\":\"Release build\",\"run\":\"mkdir build-release && cd build-release\\n../configure --enable-udev --enable-man-pages\\nmake -j$(nproc)\\nmake install DESTDIR=\\\"$PWD/staging\\\"\",\"shell\":\"bash\"},{\"name\":\"debug-log\",\"run\":\".private/ci-build.sh --werror --build-dir build-debug -- --enable-debug-log\",\"shell\":\"bash\"},{\"name\":\"disable-log\",\"run\":\".private/ci-build.sh --werror --build-dir build-nolog -- --disable-log\",\"shell\":\"bash\"},{\"name\":\"setup emsdk\",\"uses\":\"emscripten-core/setup-emsdk@v16\"},{\"name\":\"npm install (webusb test shim)\",\"run\":\"npm ci\",\"shell\":\"bash\",\"working-directory\":\"tests/webusb-test-shim\"},{\"name\":\"emscripten\",\"run\":\"emconfigure .private/ci-build.sh --build-dir build-emscripten -- --host=wasm32-unknown-emscripten\",\"shell\":\"bash\"},{\"name\":\"umockdev test\",\"run\":\".private/ci-container-build.sh docker.io/amd64/ubuntu:rolling\",\"shell\":\"bash\"}],\"artifacts\":[\"build-release/staging/**\"],\"citations\":{\"steps\":\".github/workflows/linux.yml\"},\"notes\":\"Builds multiple configurations and stages the Release install to build-release/staging, omitting PR-only sanitizer steps and uploads.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-85e81e478e8a93ed19e2d2d5eec2cf5b638d22c267094e2fe620563a2348b64f",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
