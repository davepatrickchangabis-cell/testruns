{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (002f9a407e0eb1ab157d42e635540fae2dadde9aac6d8d5262cc971983640b60, ghostfolio-linux_amd64-002f9a407e0eb1ab157d42e635540fae2dadde9aac6d8d5262cc971983640b60)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "ghostfolio/ghostfolio",
            "ref": "069ad389e0b614aecae3e2d230ad1e71e65d9d51",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"604b11dc909bcbcd4c8908adfba70ea60525b47f\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's 604b11dc909bcbcd4c8908adfba70ea60525b47f\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Use Node.js 22.23.4",
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22.23.4",
            "cache": "npm"
          }
        },
        {
          "id": "s2",
          "name": "[recipe] Install dependencies",
          "shell": "bash",
          "run": "npm ci"
        },
        {
          "id": "s3",
          "name": "[recipe] Execute tests",
          "shell": "bash",
          "run": "npm test"
        },
        {
          "id": "s4",
          "name": "[recipe] Build application",
          "shell": "bash",
          "run": "npm run build:production"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"3c6494b2-ead6-4511-8e99-ddc540472d9e\",\"content_key\":\"002f9a407e0eb1ab157d42e635540fae2dadde9aac6d8d5262cc971983640b60\",\"config_name\":\"ghostfolio-linux_amd64-002f9a407e0eb1ab157d42e635540fae2dadde9aac6d8d5262cc971983640b60\",\"attempt\":1,\"step_ids\":[\"s1\",\"s2\",\"s3\",\"s4\"],\"artifacts\":[\"dist/**\"],\"recipe\":{\"runs_on\":\"ubuntu-latest\",\"steps\":[{\"name\":\"Use Node.js 22.23.4\",\"uses\":\"actions/setup-node@v4\",\"with\":{\"node-version\":\"22.23.4\",\"cache\":\"npm\"}},{\"name\":\"Install dependencies\",\"run\":\"npm ci\",\"shell\":\"bash\"},{\"name\":\"Execute tests\",\"run\":\"npm test\",\"shell\":\"bash\"},{\"name\":\"Build application\",\"run\":\"npm run build:production\",\"shell\":\"bash\"}],\"artifacts\":[\"dist/**\"],\"citations\":{\"steps\":\".github/workflows/build-code.yml\"},\"notes\":\"Builds with Node 22.23.4 on Ubuntu, runs tests, and outputs the compiled files under dist/.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-002f9a407e0eb1ab157d42e635540fae2dadde9aac6d8d5262cc971983640b60",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
