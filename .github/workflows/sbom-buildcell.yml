{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (621ff1dbcd4e69e56908ce2e05f87e37d0de80889367813e5435ca2a7e07675e, grpc-dotnet-any_any-621ff1dbcd4e69e56908ce2e05f87e37d0de80889367813e5435ca2a7e07675e)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "grpc/grpc-dotnet",
            "ref": "7db6c142a2dd5e0fefb0681e67766e339a15dc47",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"bda649c09d023e66df1ac3b26972b9f3f05be3a8\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's bda649c09d023e66df1ac3b26972b9f3f05be3a8\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Show .NET SDK info",
          "shell": "bash",
          "run": "dotnet --info"
        },
        {
          "id": "s2",
          "name": "[recipe] Restore dependencies",
          "shell": "bash",
          "run": "dotnet restore",
          "working-directory": "src/Grpc.Core.Api"
        },
        {
          "id": "s3",
          "name": "[recipe] Build Release",
          "shell": "bash",
          "run": "dotnet build -c Release --no-restore",
          "working-directory": "src/Grpc.Core.Api"
        },
        {
          "id": "s4",
          "name": "[recipe] Pack NuGet package",
          "shell": "bash",
          "run": "dotnet pack -c Release --no-build",
          "working-directory": "src/Grpc.Core.Api"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"c6e2fe82-055e-4e40-af7c-4dbf9a22c3db\",\"content_key\":\"621ff1dbcd4e69e56908ce2e05f87e37d0de80889367813e5435ca2a7e07675e\",\"config_name\":\"grpc-dotnet-any_any-621ff1dbcd4e69e56908ce2e05f87e37d0de80889367813e5435ca2a7e07675e\",\"attempt\":1,\"step_ids\":[\"s1\",\"s2\",\"s3\",\"s4\"],\"artifacts\":[\"src/Grpc.Core.Api/bin/Release/*.nupkg\"],\"recipe\":{\"runs_on\":\"ubuntu-latest\",\"steps\":[{\"name\":\"Show .NET SDK info\",\"run\":\"dotnet --info\",\"shell\":\"bash\"},{\"name\":\"Restore dependencies\",\"run\":\"dotnet restore\",\"shell\":\"bash\",\"working-directory\":\"src/Grpc.Core.Api\"},{\"name\":\"Build Release\",\"run\":\"dotnet build -c Release --no-restore\",\"shell\":\"bash\",\"working-directory\":\"src/Grpc.Core.Api\"},{\"name\":\"Pack NuGet package\",\"run\":\"dotnet pack -c Release --no-build\",\"shell\":\"bash\",\"working-directory\":\"src/Grpc.Core.Api\"}],\"artifacts\":[\"src/Grpc.Core.Api/bin/Release/*.nupkg\"],\"citations\":{\"steps\":\"src/Grpc.Core.Api/Grpc.Core.Api.csproj\"},\"notes\":\"Builds and packs the Grpc.Core.Api .NET project in Release on Ubuntu without any external actions.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-621ff1dbcd4e69e56908ce2e05f87e37d0de80889367813e5435ca2a7e07675e",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
