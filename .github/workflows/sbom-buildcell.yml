{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (01351238809df00551acd7db83882e046f50198c8d12fcfd1d1374f81d4a0ca9, Kavita-linux_arm64_glibc-01351238809df00551acd7db83882e046f50198c8d12fcfd1d1374f81d4a0ca9)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "Kareadita/Kavita",
            "ref": "c78f8a8ba5d5870333b1b708e8f23f66ca03041f",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"f00a1a0226591510c85d2d62ec019e6c21bfc35f\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's f00a1a0226591510c85d2d62ec019e6c21bfc35f\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Enable QEMU for arm64",
          "shell": "bash",
          "run": "docker run --privileged --rm tonistiigi/binfmt --install arm64"
        },
        {
          "id": "s2",
          "name": "[recipe] Initialize Docker Buildx",
          "shell": "bash",
          "run": "docker buildx create --use --name kavita_builder && docker buildx inspect --bootstrap"
        },
        {
          "id": "s3",
          "name": "[recipe] Build linux/arm64 Docker image for ghcr.io/kareadita/kavita",
          "shell": "bash",
          "run": "set -e\nif [ -f Dockerfile ]; then df=Dockerfile; \nelif [ -f docker/Dockerfile ]; then df=docker/Dockerfile; \nelif [ -f deployments/docker/Dockerfile ]; then df=deployments/docker/Dockerfile; \nelse echo \"Dockerfile not found\" >&2; exit 1; fi\n\necho \"Using $df\"\ndocker buildx build --platform linux/arm64 -f \"$df\" -t ghcr.io/kareadita/kavita:arm64 --load ."
        },
        {
          "id": "s4",
          "name": "[recipe] Save image tarball",
          "shell": "bash",
          "run": "mkdir -p dist\ndocker save ghcr.io/kareadita/kavita:arm64 -o dist/kavita-linux-arm64.tar"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"b2b1ce03-87c5-40d9-b5c3-dd6edaa34e07\",\"content_key\":\"01351238809df00551acd7db83882e046f50198c8d12fcfd1d1374f81d4a0ca9\",\"config_name\":\"Kavita-linux_arm64_glibc-01351238809df00551acd7db83882e046f50198c8d12fcfd1d1374f81d4a0ca9\",\"attempt\":1,\"step_ids\":[\"s1\",\"s2\",\"s3\",\"s4\"],\"artifacts\":[\"dist/kavita-linux-arm64.tar\"],\"recipe\":{\"runs_on\":\"ubuntu-latest\",\"steps\":[{\"name\":\"Enable QEMU for arm64\",\"run\":\"docker run --privileged --rm tonistiigi/binfmt --install arm64\",\"shell\":\"bash\"},{\"name\":\"Initialize Docker Buildx\",\"run\":\"docker buildx create --use --name kavita_builder && docker buildx inspect --bootstrap\",\"shell\":\"bash\"},{\"name\":\"Build linux/arm64 Docker image for ghcr.io/kareadita/kavita\",\"run\":\"set -e\\nif [ -f Dockerfile ]; then df=Dockerfile; \\nelif [ -f docker/Dockerfile ]; then df=docker/Dockerfile; \\nelif [ -f deployments/docker/Dockerfile ]; then df=deployments/docker/Dockerfile; \\nelse echo \\\"Dockerfile not found\\\" >&2; exit 1; fi\\n\\necho \\\"Using $df\\\"\\ndocker buildx build --platform linux/arm64 -f \\\"$df\\\" -t ghcr.io/kareadita/kavita:arm64 --load .\",\"shell\":\"bash\"},{\"name\":\"Save image tarball\",\"run\":\"mkdir -p dist\\ndocker save ghcr.io/kareadita/kavita:arm64 -o dist/kavita-linux-arm64.tar\",\"shell\":\"bash\"}],\"artifacts\":[\"dist/kavita-linux-arm64.tar\"],\"citations\":{\"steps\":\".github/workflows/release-workflow.yml\"},\"notes\":\"Builds the linux/arm64 Docker image for ghcr.io/kareadita/kavita and saves it locally as a tarball without pushing.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-01351238809df00551acd7db83882e046f50198c8d12fcfd1d1374f81d4a0ca9",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
