{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (c496c91dcdb79169f0b961f6bffa670856a2bb0d9157b6a411dd8e63f3a2e277, Kavita-linux_x86_64_glibc-c496c91dcdb79169f0b961f6bffa670856a2bb0d9157b6a411dd8e63f3a2e277)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "Kareadita/Kavita",
            "ref": "c78f8a8ba5d5870333b1b708e8f23f66ca03041f",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"f00a1a0226591510c85d2d62ec019e6c21bfc35f\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's f00a1a0226591510c85d2d62ec019e6c21bfc35f\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Build fsprobe for linux-x64 and package",
          "shell": "bash",
          "run": "set -euo pipefail\nname=fsprobe\nrid=linux-x64\nroot=\"$PWD\"\n\n# Locate the fsprobe project directory robustly\nproj_dir=\"\"\n# Prefer csproj paths containing fsprobe\nf=$(find . -type f -iname '*fsprobe*.csproj' -print -quit 2>/dev/null || true)\nif [ -n \"${f:-}\" ]; then\n  proj_dir=$(dirname \"$f\")\nfi\n# If not found, look for a directory named fsprobe*\nif [ -z \"${proj_dir:-}\" ]; then\n  d=$(find . -type d -iname 'fsprobe*' -print -quit 2>/dev/null || true)\n  if [ -n \"${d:-}\" ]; then\n    c=$(find \"$d\" -maxdepth 2 -type f -name '*.csproj' -print -quit 2>/dev/null || true)\n    if [ -n \"${c:-}\" ]; then\n      proj_dir=$(dirname \"$c\")\n    else\n      proj_dir=\"$d\"\n    fi\n  fi\nfi\n# As a last resort, accept any *probe*.csproj\nif [ -z \"${proj_dir:-}\" ]; then\n  f=$(find . -type f -iname '*probe*.csproj' -print -quit 2>/dev/null || true)\n  if [ -n \"${f:-}\" ]; then\n    proj_dir=$(dirname \"$f\")\n  fi\nfi\n\nif [ -z \"${proj_dir:-}\" ]; then\n  echo \"Error: fsprobe project not found\" >&2\n  echo \"Searched for *fsprobe*.csproj, fsprobe* directories, and *probe*.csproj\" >&2\n  exit 1\nfi\n\necho \"Using project directory: $proj_dir\"\ncd \"$proj_dir\"\nrm -rf dist\nmkdir -p dist\nout=\"dist/$name-$rid\"\n\ndotnet publish -c Release -r \"$rid\" -o \"$out\" -v q\n\n# Include a README if available\nif [ -f README.md ]; then\n  cp README.md \"$out/\" || true\nelif [ -f \"$root/README.md\" ]; then\n  cp \"$root/README.md\" \"$out/\" || true\nfi\n\n# Package as tar.gz (preserve executable bit)\n(tar -czf \"dist/$name-$rid.tar.gz\" -C dist --mode='u+rwx,go+rx' \"$name-$rid\")\n\nls -l dist/*.tar.gz || true"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"f7237172-8d25-4cb6-ad47-75eda428bd93\",\"content_key\":\"c496c91dcdb79169f0b961f6bffa670856a2bb0d9157b6a411dd8e63f3a2e277\",\"config_name\":\"Kavita-linux_x86_64_glibc-c496c91dcdb79169f0b961f6bffa670856a2bb0d9157b6a411dd8e63f3a2e277\",\"attempt\":2,\"step_ids\":[\"s1\"],\"artifacts\":[\"**/dist/fsprobe-linux-x64.tar.gz\"],\"recipe\":{\"runs_on\":\"ubuntu-latest\",\"steps\":[{\"name\":\"Build fsprobe for linux-x64 and package\",\"run\":\"set -euo pipefail\\nname=fsprobe\\nrid=linux-x64\\nroot=\\\"$PWD\\\"\\n\\n# Locate the fsprobe project directory robustly\\nproj_dir=\\\"\\\"\\n# Prefer csproj paths containing fsprobe\\nf=$(find . -type f -iname '*fsprobe*.csproj' -print -quit 2>/dev/null || true)\\nif [ -n \\\"${f:-}\\\" ]; then\\n  proj_dir=$(dirname \\\"$f\\\")\\nfi\\n# If not found, look for a directory named fsprobe*\\nif [ -z \\\"${proj_dir:-}\\\" ]; then\\n  d=$(find . -type d -iname 'fsprobe*' -print -quit 2>/dev/null || true)\\n  if [ -n \\\"${d:-}\\\" ]; then\\n    c=$(find \\\"$d\\\" -maxdepth 2 -type f -name '*.csproj' -print -quit 2>/dev/null || true)\\n    if [ -n \\\"${c:-}\\\" ]; then\\n      proj_dir=$(dirname \\\"$c\\\")\\n    else\\n      proj_dir=\\\"$d\\\"\\n    fi\\n  fi\\nfi\\n# As a last resort, accept any *probe*.csproj\\nif [ -z \\\"${proj_dir:-}\\\" ]; then\\n  f=$(find . -type f -iname '*probe*.csproj' -print -quit 2>/dev/null || true)\\n  if [ -n \\\"${f:-}\\\" ]; then\\n    proj_dir=$(dirname \\\"$f\\\")\\n  fi\\nfi\\n\\nif [ -z \\\"${proj_dir:-}\\\" ]; then\\n  echo \\\"Error: fsprobe project not found\\\" >&2\\n  echo \\\"Searched for *fsprobe*.csproj, fsprobe* directories, and *probe*.csproj\\\" >&2\\n  exit 1\\nfi\\n\\necho \\\"Using project directory: $proj_dir\\\"\\ncd \\\"$proj_dir\\\"\\nrm -rf dist\\nmkdir -p dist\\nout=\\\"dist/$name-$rid\\\"\\n\\ndotnet publish -c Release -r \\\"$rid\\\" -o \\\"$out\\\" -v q\\n\\n# Include a README if available\\nif [ -f README.md ]; then\\n  cp README.md \\\"$out/\\\" || true\\nelif [ -f \\\"$root/README.md\\\" ]; then\\n  cp \\\"$root/README.md\\\" \\\"$out/\\\" || true\\nfi\\n\\n# Package as tar.gz (preserve executable bit)\\n(tar -czf \\\"dist/$name-$rid.tar.gz\\\" -C dist --mode='u+rwx,go+rx' \\\"$name-$rid\\\")\\n\\nls -l dist/*.tar.gz || true\",\"shell\":\"bash\"}],\"artifacts\":[\"**/dist/fsprobe-linux-x64.tar.gz\"],\"citations\":{\"steps\":\"scripts/ProbeCommon/publish.sh\"},\"notes\":\"Builds the fsprobe component for linux-x64 with dotnet publish and packages it into a tar.gz as per the repository script.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-c496c91dcdb79169f0b961f6bffa670856a2bb0d9157b6a411dd8e63f3a2e277",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
