{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (57c859d99e439667afbcc42693160de887faff9de5f8613277eff0a9d896af8b, Kavita-macos_arm64-57c859d99e439667afbcc42693160de887faff9de5f8613277eff0a9d896af8b)",
      "runs-on": "macos-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "Kareadita/Kavita",
            "ref": "c78f8a8ba5d5870333b1b708e8f23f66ca03041f",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"f00a1a0226591510c85d2d62ec019e6c21bfc35f\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's f00a1a0226591510c85d2d62ec019e6c21bfc35f\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Build and package watchprobe for osx-arm64",
          "shell": "bash",
          "run": "set -euo pipefail\nname=\"watchprobe\"\nrid=\"osx-arm64\"\n# Locate project directory containing the watchprobe .csproj\nproj_dir=\"$(git ls-files '**/*.csproj' | grep -i '/watchprobe\\.csproj$' | head -n1 | xargs dirname || true)\"\nif [[ -z \"$proj_dir\" ]]; then\n  proj_dir=\"$(git ls-files '**/*.csproj' | xargs -n1 dirname | sort -u | grep -iE '/watchprobe$' | head -n1 || true)\"\nfi\nif [[ -z \"$proj_dir\" ]]; then\n  echo \"Could not find watchprobe project directory\" >&2\n  exit 1\nfi\ncd \"$proj_dir\"\nrm -rf dist\nmkdir -p \"dist/${name}-${rid}\"\nout=\"dist/${name}-${rid}\"\ndotnet publish -c Release -r \"$rid\" -o \"$out\" -v q\nif [[ -f README.md ]]; then\n  cp README.md \"$out/\"\nfi\n# Package as tar.gz (compatible with macOS bsdtar)\ntar -czf \"dist/${name}-${rid}.tar.gz\" -C dist \"${name}-${rid}\"\nls -l \"dist/${name}-${rid}.tar.gz\""
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"b2de2c61-3bde-4147-b14b-611eaa2e8961\",\"content_key\":\"57c859d99e439667afbcc42693160de887faff9de5f8613277eff0a9d896af8b\",\"config_name\":\"Kavita-macos_arm64-57c859d99e439667afbcc42693160de887faff9de5f8613277eff0a9d896af8b\",\"attempt\":2,\"step_ids\":[\"s1\"],\"artifacts\":[\"**/dist/watchprobe-osx-arm64.tar.gz\"],\"recipe\":{\"runs_on\":\"macos-latest\",\"steps\":[{\"name\":\"Build and package watchprobe for osx-arm64\",\"run\":\"set -euo pipefail\\nname=\\\"watchprobe\\\"\\nrid=\\\"osx-arm64\\\"\\n# Locate project directory containing the watchprobe .csproj\\nproj_dir=\\\"$(git ls-files '**/*.csproj' | grep -i '/watchprobe\\\\.csproj$' | head -n1 | xargs dirname || true)\\\"\\nif [[ -z \\\"$proj_dir\\\" ]]; then\\n  proj_dir=\\\"$(git ls-files '**/*.csproj' | xargs -n1 dirname | sort -u | grep -iE '/watchprobe$' | head -n1 || true)\\\"\\nfi\\nif [[ -z \\\"$proj_dir\\\" ]]; then\\n  echo \\\"Could not find watchprobe project directory\\\" >&2\\n  exit 1\\nfi\\ncd \\\"$proj_dir\\\"\\nrm -rf dist\\nmkdir -p \\\"dist/${name}-${rid}\\\"\\nout=\\\"dist/${name}-${rid}\\\"\\ndotnet publish -c Release -r \\\"$rid\\\" -o \\\"$out\\\" -v q\\nif [[ -f README.md ]]; then\\n  cp README.md \\\"$out/\\\"\\nfi\\n# Package as tar.gz (compatible with macOS bsdtar)\\ntar -czf \\\"dist/${name}-${rid}.tar.gz\\\" -C dist \\\"${name}-${rid}\\\"\\nls -l \\\"dist/${name}-${rid}.tar.gz\\\"\",\"shell\":\"bash\"}],\"artifacts\":[\"**/dist/watchprobe-osx-arm64.tar.gz\"],\"citations\":{\"steps\":\"scripts/ProbeCommon/publish.sh\"},\"notes\":\"Replicates publish.sh for the watchprobe osx-arm64 RID only, building Release and packaging into a tar.gz.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-57c859d99e439667afbcc42693160de887faff9de5f8613277eff0a9d896af8b",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
