{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (a2ee6c8f5048c5a755ac774fb318820aa2cbe3681a02a4f768254e15cc41478d, numpy-windows_arm64_cp312-a2ee6c8f5048c5a755ac774fb318820aa2cbe3681a02a4f768254e15cc41478d)",
      "runs-on": "windows-11-arm",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "numpy/numpy",
            "ref": "70fa99843c75ae12434805bb4b1b07b94598c5c9",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"552bc2460f1ed258886e530855a34477aa0ec92e\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's 552bc2460f1ed258886e530855a34477aa0ec92e\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Set up Python 3.12 venv and build tools",
          "shell": "powershell",
          "run": "$ErrorActionPreference = 'Stop'\n# Locate Python 3.12\n$pyCmd = $null\nif (Get-Command py -ErrorAction SilentlyContinue) {\n  try {\n    & py -3.12 -c 'import sys; assert sys.version_info[:2]==(3,12)'\n    $pyCmd = 'py -3.12'\n  } catch {}\n}\nif (-not $pyCmd) {\n  if (Get-Command python -ErrorAction SilentlyContinue) {\n    $ver = & python -c 'import sys; print(f\"{sys.version_info[0]}.{sys.version_info[1]}\")'\n    if ($ver -ne '3.12') { throw 'Python 3.12 not found' }\n    $pyCmd = 'python'\n  } else {\n    throw 'Python 3.12 not found'\n  }\n}\n& $pyCmd -m venv venv\n.\\venv\\Scripts\\python -m pip install -U pip\n.\\venv\\Scripts\\python -m pip install -U wheel setuptools meson meson-python ninja cython"
        },
        {
          "id": "s2",
          "name": "[recipe] Build NumPy wheel (cp312, win_arm64)",
          "shell": "powershell",
          "run": "$ErrorActionPreference = 'Stop'\n$env:NPY_BLAS_ORDER = 'openblas'\n$env:NPY_USE_BLAS_ILP64 = '0'\n.\\venv\\Scripts\\python -m pip wheel --no-deps -w dist ."
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"c65aeed9-1e1a-48aa-b9d2-2dd0ace94798\",\"content_key\":\"a2ee6c8f5048c5a755ac774fb318820aa2cbe3681a02a4f768254e15cc41478d\",\"config_name\":\"numpy-windows_arm64_cp312-a2ee6c8f5048c5a755ac774fb318820aa2cbe3681a02a4f768254e15cc41478d\",\"attempt\":3,\"step_ids\":[\"s1\",\"s2\"],\"artifacts\":[\"dist/numpy-2.5.3-cp312-cp312-win_arm64.whl\"],\"recipe\":{\"runs_on\":\"windows-11-arm\",\"steps\":[{\"name\":\"Set up Python 3.12 venv and build tools\",\"run\":\"$ErrorActionPreference = 'Stop'\\n# Locate Python 3.12\\n$pyCmd = $null\\nif (Get-Command py -ErrorAction SilentlyContinue) {\\n  try {\\n    & py -3.12 -c 'import sys; assert sys.version_info[:2]==(3,12)'\\n    $pyCmd = 'py -3.12'\\n  } catch {}\\n}\\nif (-not $pyCmd) {\\n  if (Get-Command python -ErrorAction SilentlyContinue) {\\n    $ver = & python -c 'import sys; print(f\\\"{sys.version_info[0]}.{sys.version_info[1]}\\\")'\\n    if ($ver -ne '3.12') { throw 'Python 3.12 not found' }\\n    $pyCmd = 'python'\\n  } else {\\n    throw 'Python 3.12 not found'\\n  }\\n}\\n& $pyCmd -m venv venv\\n.\\\\venv\\\\Scripts\\\\python -m pip install -U pip\\n.\\\\venv\\\\Scripts\\\\python -m pip install -U wheel setuptools meson meson-python ninja cython\",\"shell\":\"powershell\"},{\"name\":\"Build NumPy wheel (cp312, win_arm64)\",\"run\":\"$ErrorActionPreference = 'Stop'\\n$env:NPY_BLAS_ORDER = 'openblas'\\n$env:NPY_USE_BLAS_ILP64 = '0'\\n.\\\\venv\\\\Scripts\\\\python -m pip wheel --no-deps -w dist .\",\"shell\":\"powershell\"}],\"artifacts\":[\"dist/numpy-2.5.3-cp312-cp312-win_arm64.whl\"],\"citations\":{\"steps\":\"README.md\"},\"notes\":\"Builds the NumPy 2.5.3 cp312 win_arm64 wheel from the checked-out source using a local Python 3.12 environment and Meson via pip.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-a2ee6c8f5048c5a755ac774fb318820aa2cbe3681a02a4f768254e15cc41478d",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
