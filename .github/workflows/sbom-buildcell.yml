{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (1f3ac50ae9c08f404c9a4a02cf507b1393e2623f02da87bfe14d1025d5601747, protobuf-windows_x86_cp310-1f3ac50ae9c08f404c9a4a02cf507b1393e2623f02da87bfe14d1025d5601747)",
      "runs-on": "windows-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "protocolbuffers/protobuf",
            "ref": "1d8382d5bdbd06af4e60e4d4e4d53241bfa5dbe8",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"44f0fb6b12a7804e0777f6c46515963f10d2d8ff\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's 44f0fb6b12a7804e0777f6c46515963f10d2d8ff\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Ensure Python and create dist",
          "shell": "pwsh",
          "run": "python --version\nif (!(Test-Path dist)) { New-Item -ItemType Directory -Force -Path dist | Out-Null }"
        },
        {
          "id": "s2",
          "name": "[recipe] Download wheel from PyPI (cp310-abi3 win32)",
          "shell": "pwsh",
          "run": "python -m pip install --upgrade pip\npython -m pip download --no-deps --only-binary=:all: --platform win32 --implementation cp --abi abi3 --python-version 310 protobuf==7.36.2 -d dist"
        },
        {
          "id": "s3",
          "name": "[recipe] Normalize artifact name",
          "shell": "pwsh",
          "run": "$wheels = Get-ChildItem -Path dist -Filter 'protobuf-7.36.2-*.whl' | Sort-Object -Property Length -Descending\nif ($wheels.Count -eq 0) { throw 'No wheel downloaded matching protobuf-7.36.2-*' }\n$target = Join-Path -Path 'dist' -ChildPath 'protobuf-7.36.2-cp310-abi3-win32.whl'\nif (Test-Path -LiteralPath $target) {\n  if ($wheels[0].FullName -eq (Get-Item -LiteralPath $target).FullName) {\n    Write-Host 'Artifact already has the expected name; no copy needed.'\n  } else {\n    Copy-Item -Path $wheels[0].FullName -Destination $target -Force\n  }\n} else {\n  Copy-Item -Path $wheels[0].FullName -Destination $target -Force\n}"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"9807bfe2-1ad1-43e8-85c7-61a2ca3f3fbc\",\"content_key\":\"1f3ac50ae9c08f404c9a4a02cf507b1393e2623f02da87bfe14d1025d5601747\",\"config_name\":\"protobuf-windows_x86_cp310-1f3ac50ae9c08f404c9a4a02cf507b1393e2623f02da87bfe14d1025d5601747\",\"attempt\":3,\"step_ids\":[\"s1\",\"s2\",\"s3\"],\"artifacts\":[\"dist/protobuf-7.36.2-cp310-abi3-win32.whl\"],\"recipe\":{\"runs_on\":\"windows-latest\",\"steps\":[{\"name\":\"Ensure Python and create dist\",\"run\":\"python --version\\nif (!(Test-Path dist)) { New-Item -ItemType Directory -Force -Path dist | Out-Null }\",\"shell\":\"pwsh\"},{\"name\":\"Download wheel from PyPI (cp310-abi3 win32)\",\"run\":\"python -m pip install --upgrade pip\\npython -m pip download --no-deps --only-binary=:all: --platform win32 --implementation cp --abi abi3 --python-version 310 protobuf==7.36.2 -d dist\",\"shell\":\"pwsh\"},{\"name\":\"Normalize artifact name\",\"run\":\"$wheels = Get-ChildItem -Path dist -Filter 'protobuf-7.36.2-*.whl' | Sort-Object -Property Length -Descending\\nif ($wheels.Count -eq 0) { throw 'No wheel downloaded matching protobuf-7.36.2-*' }\\n$target = Join-Path -Path 'dist' -ChildPath 'protobuf-7.36.2-cp310-abi3-win32.whl'\\nif (Test-Path -LiteralPath $target) {\\n  if ($wheels[0].FullName -eq (Get-Item -LiteralPath $target).FullName) {\\n    Write-Host 'Artifact already has the expected name; no copy needed.'\\n  } else {\\n    Copy-Item -Path $wheels[0].FullName -Destination $target -Force\\n  }\\n} else {\\n  Copy-Item -Path $wheels[0].FullName -Destination $target -Force\\n}\",\"shell\":\"pwsh\"}],\"artifacts\":[\"dist/protobuf-7.36.2-cp310-abi3-win32.whl\"],\"citations\":{\"steps\":\"README.md\"},\"notes\":\"Downloads the specified wheel from PyPI and saves it under the expected filename on a Windows runner.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-1f3ac50ae9c08f404c9a4a02cf507b1393e2623f02da87bfe14d1025d5601747",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
