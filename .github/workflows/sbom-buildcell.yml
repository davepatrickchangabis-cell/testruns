{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (80067053f30ac4a39a7e9753b74cfe9d2c959210e13e7a5d3ebceef0d85bf0d3, protobuf-linux_x86_64_glibc_cp310-80067053f30ac4a39a7e9753b74cfe9d2c959210e13e7a5d3ebceef0d85bf0d3)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "protocolbuffers/protobuf",
            "ref": "1d8382d5bdbd06af4e60e4d4e4d53241bfa5dbe8",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"44f0fb6b12a7804e0777f6c46515963f10d2d8ff\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's 44f0fb6b12a7804e0777f6c46515963f10d2d8ff\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Build manylinux2014 x86_64 cp310 abi3 wheel in Docker",
          "shell": "bash",
          "run": "set -euo pipefail\ndocker run --rm -e PLAT=manylinux2014_x86_64 -v \"$PWD\":/io quay.io/pypa/manylinux2014_x86_64 /bin/bash -c '\n  set -euo pipefail\n  PYBIN=/opt/python/cp310-cp310/bin\n  $PYBIN/python -V\n  $PYBIN/pip install -U pip setuptools wheel build auditwheel\n  cd /io\n  # Build the wheel\n  $PYBIN/python -m build --wheel\n  # Repair to manylinux2014 tag\n  mkdir -p wheelhouse\n  $PYBIN/python -m auditwheel repair --plat manylinux2014_x86_64 dist/protobuf-7.36.2-*.whl -w wheelhouse\n  # Place final artifact in dist with the expected filename\n  mkdir -p dist\n  cp wheelhouse/protobuf-7.36.2-cp310-abi3-manylinux2014_x86_64.whl dist/\n  ls -l dist\n'"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"64950f0a-01dc-4a5a-9870-80de5af77224\",\"content_key\":\"80067053f30ac4a39a7e9753b74cfe9d2c959210e13e7a5d3ebceef0d85bf0d3\",\"config_name\":\"protobuf-linux_x86_64_glibc_cp310-80067053f30ac4a39a7e9753b74cfe9d2c959210e13e7a5d3ebceef0d85bf0d3\",\"attempt\":2,\"step_ids\":[\"s1\"],\"artifacts\":[\"dist/protobuf-7.36.2-cp310-abi3-manylinux2014_x86_64.whl\"],\"recipe\":{\"runs_on\":\"ubuntu-latest\",\"steps\":[{\"name\":\"Build manylinux2014 x86_64 cp310 abi3 wheel in Docker\",\"run\":\"set -euo pipefail\\ndocker run --rm -e PLAT=manylinux2014_x86_64 -v \\\"$PWD\\\":/io quay.io/pypa/manylinux2014_x86_64 /bin/bash -c '\\n  set -euo pipefail\\n  PYBIN=/opt/python/cp310-cp310/bin\\n  $PYBIN/python -V\\n  $PYBIN/pip install -U pip setuptools wheel build auditwheel\\n  cd /io\\n  # Build the wheel\\n  $PYBIN/python -m build --wheel\\n  # Repair to manylinux2014 tag\\n  mkdir -p wheelhouse\\n  $PYBIN/python -m auditwheel repair --plat manylinux2014_x86_64 dist/protobuf-7.36.2-*.whl -w wheelhouse\\n  # Place final artifact in dist with the expected filename\\n  mkdir -p dist\\n  cp wheelhouse/protobuf-7.36.2-cp310-abi3-manylinux2014_x86_64.whl dist/\\n  ls -l dist\\n'\",\"shell\":\"bash\"}],\"artifacts\":[\"dist/protobuf-7.36.2-cp310-abi3-manylinux2014_x86_64.whl\"],\"citations\":{\"steps\":\"README.md\"},\"notes\":\"Builds the cp310 abi3 wheel inside the official manylinux2014_x86_64 image and outputs the repaired wheel to dist/.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-80067053f30ac4a39a7e9753b74cfe9d2c959210e13e7a5d3ebceef0d85bf0d3",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
