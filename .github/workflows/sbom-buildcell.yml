{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (c491d0a6bbd38d606f25b30cfa46ff755e4922c4d34e2c3ad493873c6fb92b74, notepad-plus-plus-windows_x86_64-c491d0a6bbd38d606f25b30cfa46ff755e4922c4d34e2c3ad493873c6fb92b74)",
      "runs-on": "windows-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "notepad-plus-plus/notepad-plus-plus",
            "ref": "5ee7a765e919a29f49cd65484568f5ce1c461484",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"3537f6a542f80020d91b4bc58bb65631b9c6a04d\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's 3537f6a542f80020d91b4bc58bb65631b9c6a04d\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Modify resource.h N++ version to avoid confusion",
          "shell": "pwsh",
          "run": "$content = Get-Content -Path 'resource.h'\n$newContent = $content -replace 'TEXT\\(\"Notepad\\+\\+ v.*\"\\)', 'TEXT(\"Notepad++ GH_BUILD\")'\n$newContent | Set-Content -Path 'resource.h'\n",
          "working-directory": "PowerEditor/src/"
        },
        {
          "id": "s2",
          "name": "[recipe] Install and update MSYS2 tools",
          "uses": "msys2/setup-msys2@v2",
          "with": {
            "msystem": "MINGW64",
            "install": "mingw-w64-x86_64-gcc mingw-w64-x86_64-make",
            "update": true,
            "release": false
          }
        },
        {
          "id": "s3",
          "name": "[recipe] Make n++ exe",
          "shell": "powershell",
          "run": "Write-host \"MINGW64\"\nWrite-host \"Release\"\n$Env:MSYSTEM = 'MINGW64'\n$Env:Path = 'C:\\msys64\\usr\\bin' + [IO.Path]::PathSeparator + $Env:Path\n$Env:Path = 'C:\\msys64\\' + 'MINGW64'.ToLower() + '\\bin' + [IO.Path]::PathSeparator + $Env:Path\nif ( $false ) {$Env:DEBUG = '1'}\nWrite-Output \"Tools version:\"\nWrite-Output (((gcc --version) | select-object -first 1) + \" \" + (gcc -dumpmachine))\nWrite-Output (mingw32-make --version) | select-object -first 1\nWrite-Output (sh --version) | select-object -first 1\nmingw32-make -f PowerEditor\\gcc\\makefile\n"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"a3bba0b1-c8ba-4c04-b8d8-4bcaed8a28ed\",\"content_key\":\"c491d0a6bbd38d606f25b30cfa46ff755e4922c4d34e2c3ad493873c6fb92b74\",\"config_name\":\"notepad-plus-plus-windows_x86_64-c491d0a6bbd38d606f25b30cfa46ff755e4922c4d34e2c3ad493873c6fb92b74\",\"attempt\":2,\"step_ids\":[\"s1\",\"s2\",\"s3\"],\"artifacts\":[\"bin.gcc.x86_64/notepad++.exe\"],\"recipe\":{\"runs_on\":\"windows-latest\",\"steps\":[{\"name\":\"Modify resource.h N++ version to avoid confusion\",\"run\":\"$content = Get-Content -Path 'resource.h'\\n$newContent = $content -replace 'TEXT\\\\(\\\"Notepad\\\\+\\\\+ v.*\\\"\\\\)', 'TEXT(\\\"Notepad++ GH_BUILD\\\")'\\n$newContent | Set-Content -Path 'resource.h'\\n\",\"shell\":\"pwsh\",\"working-directory\":\"PowerEditor/src/\"},{\"name\":\"Install and update MSYS2 tools\",\"uses\":\"msys2/setup-msys2@v2\",\"with\":{\"msystem\":\"MINGW64\",\"install\":\"mingw-w64-x86_64-gcc mingw-w64-x86_64-make\",\"update\":true,\"release\":false}},{\"name\":\"Make n++ exe\",\"run\":\"Write-host \\\"MINGW64\\\"\\nWrite-host \\\"Release\\\"\\n$Env:MSYSTEM = 'MINGW64'\\n$Env:Path = 'C:\\\\msys64\\\\usr\\\\bin' + [IO.Path]::PathSeparator + $Env:Path\\n$Env:Path = 'C:\\\\msys64\\\\' + 'MINGW64'.ToLower() + '\\\\bin' + [IO.Path]::PathSeparator + $Env:Path\\nif ( $false ) {$Env:DEBUG = '1'}\\nWrite-Output \\\"Tools version:\\\"\\nWrite-Output (((gcc --version) | select-object -first 1) + \\\" \\\" + (gcc -dumpmachine))\\nWrite-Output (mingw32-make --version) | select-object -first 1\\nWrite-Output (sh --version) | select-object -first 1\\nmingw32-make -f PowerEditor\\\\gcc\\\\makefile\\n\",\"shell\":\"powershell\"}],\"artifacts\":[\"bin.gcc.x86_64/notepad++.exe\"],\"citations\":{\"steps\":\".github/workflows/CI_build.yml\"},\"notes\":\"Builds Notepad++ with MSYS2 MINGW64 GCC in Release on Windows and produces the executable.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-c491d0a6bbd38d606f25b30cfa46ff755e4922c4d34e2c3ad493873c6fb92b74",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
