{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (c3b0fb699abf33f3eabdbc4c82bc9bda9311b84900908570b663455da07c5d00, notepad-plus-plus-windows_x86_64-c3b0fb699abf33f3eabdbc4c82bc9bda9311b84900908570b663455da07c5d00)",
      "runs-on": "windows-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "notepad-plus-plus/notepad-plus-plus",
            "ref": "5ee7a765e919a29f49cd65484568f5ce1c461484",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"3537f6a542f80020d91b4bc58bb65631b9c6a04d\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's 3537f6a542f80020d91b4bc58bb65631b9c6a04d\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Add msbuild to PATH",
          "uses": "microsoft/setup-msbuild@v3"
        },
        {
          "id": "s2",
          "name": "[recipe] Modify resource.h N++ version to avoid confusion",
          "shell": "powershell",
          "run": "$content = Get-Content -Path 'resource.h'\n$newContent = $content -replace 'TEXT\\(\\\"Notepad\\+\\+ v.*\\\"\\)', 'TEXT(\"Notepad++ GH_BUILD\")'\n$newContent | Set-Content -Path 'resource.h'",
          "working-directory": "PowerEditor/src"
        },
        {
          "id": "s3",
          "name": "[recipe] MSBuild of n++ exe",
          "shell": "powershell",
          "run": "msbuild notepadPlus.sln /m /p:configuration=\"Release\" /p:platform=\"x64\"",
          "working-directory": "PowerEditor/visual.net"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"39d68bfc-caf3-4a08-8e41-53fcbbdef066\",\"content_key\":\"c3b0fb699abf33f3eabdbc4c82bc9bda9311b84900908570b663455da07c5d00\",\"config_name\":\"notepad-plus-plus-windows_x86_64-c3b0fb699abf33f3eabdbc4c82bc9bda9311b84900908570b663455da07c5d00\",\"attempt\":1,\"step_ids\":[\"s1\",\"s2\",\"s3\"],\"artifacts\":[\"PowerEditor/bin64/Notepad++.exe\"],\"recipe\":{\"runs_on\":\"windows-latest\",\"steps\":[{\"name\":\"Add msbuild to PATH\",\"uses\":\"microsoft/setup-msbuild@v3\"},{\"name\":\"Modify resource.h N++ version to avoid confusion\",\"run\":\"$content = Get-Content -Path 'resource.h'\\n$newContent = $content -replace 'TEXT\\\\(\\\\\\\"Notepad\\\\+\\\\+ v.*\\\\\\\"\\\\)', 'TEXT(\\\"Notepad++ GH_BUILD\\\")'\\n$newContent | Set-Content -Path 'resource.h'\",\"shell\":\"powershell\",\"working-directory\":\"PowerEditor/src\"},{\"name\":\"MSBuild of n++ exe\",\"run\":\"msbuild notepadPlus.sln /m /p:configuration=\\\"Release\\\" /p:platform=\\\"x64\\\"\",\"shell\":\"powershell\",\"working-directory\":\"PowerEditor/visual.net\"}],\"artifacts\":[\"PowerEditor/bin64/Notepad++.exe\"],\"citations\":{\"steps\":\".github/workflows/CI_build.yml\"},\"notes\":\"Builds Notepad++ x64 Release with MSBuild and produces PowerEditor/bin64/Notepad++.exe.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-c3b0fb699abf33f3eabdbc4c82bc9bda9311b84900908570b663455da07c5d00",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
