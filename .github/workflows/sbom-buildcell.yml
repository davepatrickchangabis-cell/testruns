{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (609fad61c67f08e842a815b9cb312e601563354a01d089fff1bd49bb6a5097cf, Kavita-linux_armv7_glibc-609fad61c67f08e842a815b9cb312e601563354a01d089fff1bd49bb6a5097cf)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "Kareadita/Kavita",
            "ref": "c78f8a8ba5d5870333b1b708e8f23f66ca03041f",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"f00a1a0226591510c85d2d62ec019e6c21bfc35f\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's f00a1a0226591510c85d2d62ec019e6c21bfc35f\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Set up Docker Buildx",
          "shell": "bash",
          "run": "set -e\nexport DOCKER_CLI_EXPERIMENTAL=enabled\n# Create or select a buildx builder\nif ! docker buildx inspect kavita-builder >/dev/null 2>&1; then\n  docker buildx create --name kavita-builder --driver docker-container --use\nelse\n  docker buildx use kavita-builder\nfi\n# Bootstrap (ensures QEMU/binfmt emulators are ready if available)\ndocker buildx inspect --bootstrap\n\necho \"Available builders:\" >&2\ndocker buildx ls"
        },
        {
          "id": "s2",
          "name": "[recipe] Build linux/arm/v7 Docker image tar",
          "shell": "bash",
          "run": "set -e\nmkdir -p build/docker\n# Try to locate a Dockerfile sensibly\nDOCKERFILE=\nif [ -f Dockerfile ]; then\n  DOCKERFILE=Dockerfile\nelif [ -f docker/Dockerfile ]; then\n  DOCKERFILE=docker/Dockerfile\nelif [ -f Docker/Dockerfile ]; then\n  DOCKERFILE=Docker/Dockerfile\nelse\n  DOCKERFILE=$(git ls-files | grep -Ei '(^|/)dockerfile$' | head -n1 || true)\nfi\nif [ -z \"$DOCKERFILE\" ]; then\n  echo \"Error: No Dockerfile found in repository\" >&2\n  exit 1\nfi\n\necho \"Using Dockerfile: $DOCKERFILE\" >&2\n# Build single-platform image and export as a tarball artifact (no push)\ndocker buildx build \\\n  --platform linux/arm/v7 \\\n  -t jvmilazz0/kavita:ci-armv7 \\\n  -f \"$DOCKERFILE\" \\\n  -o type=tar,dest=build/docker/kavita-linux-armv7.tar \\\n  ."
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"1f09a082-ea26-4e8c-92aa-34f1d55676d3\",\"content_key\":\"609fad61c67f08e842a815b9cb312e601563354a01d089fff1bd49bb6a5097cf\",\"config_name\":\"Kavita-linux_armv7_glibc-609fad61c67f08e842a815b9cb312e601563354a01d089fff1bd49bb6a5097cf\",\"attempt\":1,\"step_ids\":[\"s1\",\"s2\"],\"artifacts\":[\"build/docker/kavita-linux-armv7.tar\"],\"recipe\":{\"runs_on\":\"ubuntu-latest\",\"steps\":[{\"name\":\"Set up Docker Buildx\",\"run\":\"set -e\\nexport DOCKER_CLI_EXPERIMENTAL=enabled\\n# Create or select a buildx builder\\nif ! docker buildx inspect kavita-builder >/dev/null 2>&1; then\\n  docker buildx create --name kavita-builder --driver docker-container --use\\nelse\\n  docker buildx use kavita-builder\\nfi\\n# Bootstrap (ensures QEMU/binfmt emulators are ready if available)\\ndocker buildx inspect --bootstrap\\n\\necho \\\"Available builders:\\\" >&2\\ndocker buildx ls\",\"shell\":\"bash\"},{\"name\":\"Build linux/arm/v7 Docker image tar\",\"run\":\"set -e\\nmkdir -p build/docker\\n# Try to locate a Dockerfile sensibly\\nDOCKERFILE=\\nif [ -f Dockerfile ]; then\\n  DOCKERFILE=Dockerfile\\nelif [ -f docker/Dockerfile ]; then\\n  DOCKERFILE=docker/Dockerfile\\nelif [ -f Docker/Dockerfile ]; then\\n  DOCKERFILE=Docker/Dockerfile\\nelse\\n  DOCKERFILE=$(git ls-files | grep -Ei '(^|/)dockerfile$' | head -n1 || true)\\nfi\\nif [ -z \\\"$DOCKERFILE\\\" ]; then\\n  echo \\\"Error: No Dockerfile found in repository\\\" >&2\\n  exit 1\\nfi\\n\\necho \\\"Using Dockerfile: $DOCKERFILE\\\" >&2\\n# Build single-platform image and export as a tarball artifact (no push)\\ndocker buildx build \\\\\\n  --platform linux/arm/v7 \\\\\\n  -t jvmilazz0/kavita:ci-armv7 \\\\\\n  -f \\\"$DOCKERFILE\\\" \\\\\\n  -o type=tar,dest=build/docker/kavita-linux-armv7.tar \\\\\\n  .\",\"shell\":\"bash\"}],\"artifacts\":[\"build/docker/kavita-linux-armv7.tar\"],\"citations\":{\"steps\":\".github/workflows/release-workflow.yml\"},\"notes\":\"Builds the linux/arm/v7 Docker image for jvmilazz0/kavita using buildx and exports it as a tarball without pushing.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-609fad61c67f08e842a815b9cb312e601563354a01d089fff1bd49bb6a5097cf",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
