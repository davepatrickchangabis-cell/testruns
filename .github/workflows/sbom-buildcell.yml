{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (0ee6c0fd5faf480be7b209da43a6c58cf26aae4c21854b66c63a2c5b5b29d563, Kavita-linux_x86_64_glibc-0ee6c0fd5faf480be7b209da43a6c58cf26aae4c21854b66c63a2c5b5b29d563)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "Kareadita/Kavita",
            "ref": "c78f8a8ba5d5870333b1b708e8f23f66ca03041f",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"f00a1a0226591510c85d2d62ec019e6c21bfc35f\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's f00a1a0226591510c85d2d62ec019e6c21bfc35f\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Install .NET SDK 8.0",
          "shell": "bash",
          "run": "set -euo pipefail\ncurl -sSLf https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh\nchmod +x dotnet-install.sh\n./dotnet-install.sh --channel 8.0 --install-dir \"$HOME/.dotnet\"\necho \"PATH=$HOME/.dotnet:$HOME/.dotnet/tools:$PATH\" >> $GITHUB_ENV\n$HOME/.dotnet/dotnet --info"
        },
        {
          "id": "s2",
          "name": "[recipe] Publish Kavita server for linux-x64",
          "shell": "bash",
          "run": "set -euo pipefail\nexport PATH=\"$HOME/.dotnet:$HOME/.dotnet/tools:$PATH\"\nproj=\"\"\nif [ -f \"src/Kavita/Kavita.csproj\" ]; then proj=\"src/Kavita/Kavita.csproj\";\nelif [ -f \"Kavita/Kavita.csproj\" ]; then proj=\"Kavita/Kavita.csproj\";\nelse\n  mapfile -t csprojs < <(find . -name \"*.csproj\" -type f | sort)\n  for p in \"${csprojs[@]}\"; do\n    if grep -q \"<OutputType>Exe</OutputType>\" \"$p\" || grep -q \"Microsoft.NET.Sdk.Web\" \"$p\"; then proj=\"$p\"; break; fi\n  done\nfi\nif [ -z \"$proj\" ]; then\n  echo \"Could not locate Kavita server project (.csproj).\" >&2\n  echo \"Found projects:\" >&2\n  find . -name \"*.csproj\" -type f >&2\n  exit 1\nfi\necho \"Using project: $proj\"\n$HOME/.dotnet/dotnet restore \"$proj\"\n$HOME/.dotnet/dotnet publish \"$proj\" -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true\npubdir=$(dirname \"$proj\")/bin/Release/*/linux-x64/publish\nls -la $pubdir || true"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"680186f8-cbad-485e-bc21-6137495031ba\",\"content_key\":\"0ee6c0fd5faf480be7b209da43a6c58cf26aae4c21854b66c63a2c5b5b29d563\",\"config_name\":\"Kavita-linux_x86_64_glibc-0ee6c0fd5faf480be7b209da43a6c58cf26aae4c21854b66c63a2c5b5b29d563\",\"attempt\":3,\"step_ids\":[\"s1\",\"s2\"],\"artifacts\":[\"**/bin/Release/*/linux-x64/publish/**\"],\"recipe\":{\"runs_on\":\"ubuntu-latest\",\"steps\":[{\"name\":\"Install .NET SDK 8.0\",\"run\":\"set -euo pipefail\\ncurl -sSLf https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh\\nchmod +x dotnet-install.sh\\n./dotnet-install.sh --channel 8.0 --install-dir \\\"$HOME/.dotnet\\\"\\necho \\\"PATH=$HOME/.dotnet:$HOME/.dotnet/tools:$PATH\\\" >> $GITHUB_ENV\\n$HOME/.dotnet/dotnet --info\",\"shell\":\"bash\"},{\"name\":\"Publish Kavita server for linux-x64\",\"run\":\"set -euo pipefail\\nexport PATH=\\\"$HOME/.dotnet:$HOME/.dotnet/tools:$PATH\\\"\\nproj=\\\"\\\"\\nif [ -f \\\"src/Kavita/Kavita.csproj\\\" ]; then proj=\\\"src/Kavita/Kavita.csproj\\\";\\nelif [ -f \\\"Kavita/Kavita.csproj\\\" ]; then proj=\\\"Kavita/Kavita.csproj\\\";\\nelse\\n  mapfile -t csprojs < <(find . -name \\\"*.csproj\\\" -type f | sort)\\n  for p in \\\"${csprojs[@]}\\\"; do\\n    if grep -q \\\"<OutputType>Exe</OutputType>\\\" \\\"$p\\\" || grep -q \\\"Microsoft.NET.Sdk.Web\\\" \\\"$p\\\"; then proj=\\\"$p\\\"; break; fi\\n  done\\nfi\\nif [ -z \\\"$proj\\\" ]; then\\n  echo \\\"Could not locate Kavita server project (.csproj).\\\" >&2\\n  echo \\\"Found projects:\\\" >&2\\n  find . -name \\\"*.csproj\\\" -type f >&2\\n  exit 1\\nfi\\necho \\\"Using project: $proj\\\"\\n$HOME/.dotnet/dotnet restore \\\"$proj\\\"\\n$HOME/.dotnet/dotnet publish \\\"$proj\\\" -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true\\npubdir=$(dirname \\\"$proj\\\")/bin/Release/*/linux-x64/publish\\nls -la $pubdir || true\",\"shell\":\"bash\"}],\"artifacts\":[\"**/bin/Release/*/linux-x64/publish/**\"],\"citations\":{\"steps\":\".github/workflows/release-workflow.yml\"},\"notes\":\"Builds the Kavita server for linux-x64 by publishing a self-contained Release output.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-0ee6c0fd5faf480be7b209da43a6c58cf26aae4c21854b66c63a2c5b5b29d563",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
