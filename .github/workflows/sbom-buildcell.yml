{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (50ff5d10b8752b1c4edb41c8ac011e3f517924bee399c65f672fbf51fa664828, numpy-linux_aarch64_glibc_cp312-50ff5d10b8752b1c4edb41c8ac011e3f517924bee399c65f672fbf51fa664828)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "numpy/numpy",
            "ref": "70fa99843c75ae12434805bb4b1b07b94598c5c9",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"552bc2460f1ed258886e530855a34477aa0ec92e\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's 552bc2460f1ed258886e530855a34477aa0ec92e\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Install qemu-user-static for ARM emulation",
          "shell": "bash",
          "run": "sudo apt-get update && sudo apt-get install -y qemu-user-static"
        },
        {
          "id": "s2",
          "name": "[recipe] Enable binfmt for arm64 in Docker",
          "shell": "bash",
          "run": "docker run --privileged --rm tonistiigi/binfmt --install arm64"
        },
        {
          "id": "s3",
          "name": "[recipe] Pull manylinux aarch64 image",
          "shell": "bash",
          "run": "docker pull quay.io/pypa/manylinux_2_28_aarch64"
        },
        {
          "id": "s4",
          "name": "[recipe] Build NumPy cp312 aarch64 manylinux wheel inside container",
          "shell": "bash",
          "run": "docker run --rm --platform linux/arm64 -e PIP_DISABLE_PIP_VERSION_CHECK=1 -v \"$PWD\":/io quay.io/pypa/manylinux_2_28_aarch64 /bin/bash -lc '\nset -euxo pipefail\nPYBIN=/opt/python/cp312-cp312/bin\n$PYBIN/python -m pip install -U pip setuptools wheel build meson-python ninja cython\ncd /io\n$PYBIN/python -m build --wheel --no-isolation\n# Repair to manylinux tag; output goes to /io/dist\nauditwheel repair --plat manylinux_2_28_aarch64 -w /io/dist /io/dist/*.whl\nls -l /io/dist\n'"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"3e5dfa57-eca8-403f-954b-f8b3329d22a0\",\"content_key\":\"50ff5d10b8752b1c4edb41c8ac011e3f517924bee399c65f672fbf51fa664828\",\"config_name\":\"numpy-linux_aarch64_glibc_cp312-50ff5d10b8752b1c4edb41c8ac011e3f517924bee399c65f672fbf51fa664828\",\"attempt\":3,\"step_ids\":[\"s1\",\"s2\",\"s3\",\"s4\"],\"artifacts\":[\"dist/*cp312*manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl\",\"dist/*cp312*manylinux_2_28_aarch64.whl\"],\"recipe\":{\"runs_on\":\"ubuntu-latest\",\"steps\":[{\"name\":\"Install qemu-user-static for ARM emulation\",\"run\":\"sudo apt-get update && sudo apt-get install -y qemu-user-static\",\"shell\":\"bash\"},{\"name\":\"Enable binfmt for arm64 in Docker\",\"run\":\"docker run --privileged --rm tonistiigi/binfmt --install arm64\",\"shell\":\"bash\"},{\"name\":\"Pull manylinux aarch64 image\",\"run\":\"docker pull quay.io/pypa/manylinux_2_28_aarch64\",\"shell\":\"bash\"},{\"name\":\"Build NumPy cp312 aarch64 manylinux wheel inside container\",\"run\":\"docker run --rm --platform linux/arm64 -e PIP_DISABLE_PIP_VERSION_CHECK=1 -v \\\"$PWD\\\":/io quay.io/pypa/manylinux_2_28_aarch64 /bin/bash -lc '\\nset -euxo pipefail\\nPYBIN=/opt/python/cp312-cp312/bin\\n$PYBIN/python -m pip install -U pip setuptools wheel build meson-python ninja cython\\ncd /io\\n$PYBIN/python -m build --wheel --no-isolation\\n# Repair to manylinux tag; output goes to /io/dist\\nauditwheel repair --plat manylinux_2_28_aarch64 -w /io/dist /io/dist/*.whl\\nls -l /io/dist\\n'\",\"shell\":\"bash\"}],\"artifacts\":[\"dist/*cp312*manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl\",\"dist/*cp312*manylinux_2_28_aarch64.whl\"],\"citations\":{\"steps\":\"pyproject.toml\"},\"notes\":\"Builds the NumPy 2.5.3 CPython 3.12 aarch64 manylinux wheel inside a manylinux_2_28_aarch64 Docker container using QEMU on ubuntu-latest.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-50ff5d10b8752b1c4edb41c8ac011e3f517924bee399c65f672fbf51fa664828",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
