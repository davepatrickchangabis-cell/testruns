{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (eb051ff35c5d0da1de59f0e3e2a1bc9eeac446488251513bd92606b3f93dde84, Kavita-linux_armv7_glibc-eb051ff35c5d0da1de59f0e3e2a1bc9eeac446488251513bd92606b3f93dde84)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "Kareadita/Kavita",
            "ref": "c78f8a8ba5d5870333b1b708e8f23f66ca03041f",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"f00a1a0226591510c85d2d62ec019e6c21bfc35f\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's f00a1a0226591510c85d2d62ec019e6c21bfc35f\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Install QEMU for linux/arm/v7 cross-builds",
          "shell": "bash",
          "run": "set -e\nsudo apt-get update\nsudo apt-get install -y qemu-user-binfmt\n# Register binfmt handlers for ARM\nsudo docker run --rm --privileged tonistiigi/binfmt --install arm"
        },
        {
          "id": "s2",
          "name": "[recipe] Set up Docker Buildx",
          "shell": "bash",
          "run": "set -e\n# Create and use a buildx builder backed by docker-container\nif ! docker buildx inspect kavita-builder >/dev/null 2>&1; then\n  docker buildx create --name kavita-builder --driver docker-container --use\nfi\ndocker buildx inspect --bootstrap"
        },
        {
          "id": "s3",
          "name": "[recipe] Create placeholder _output tarball for Docker build",
          "shell": "bash",
          "run": "set -e\nmkdir -p _output tmp_out\nprintf \"Kavita placeholder build artifact\\n\" > tmp_out/README.txt\ntar -czf _output/placeholder.tar.gz -C tmp_out .\nrm -rf tmp_out\nls -l _output"
        },
        {
          "id": "s4",
          "name": "[recipe] Build linux/arm/v7 Docker image and save as tarball",
          "shell": "bash",
          "run": "set -e\nIMAGE_REPO=\"ghcr.io/kareadita/kavita\"\nIMAGE_TAG=\"armv7-local\"\n# Build and load the single-arch image into the local docker daemon\ndocker buildx build --platform linux/arm/v7 -t \"$IMAGE_REPO:$IMAGE_TAG\" --load .\n# Save as artifact tarball\nmkdir -p dist\ndocker save -o dist/kavita-linux-armv7.tar \"$IMAGE_REPO:$IMAGE_TAG\""
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"be2110fb-f5c7-45bb-9466-1da1f0287fd7\",\"content_key\":\"eb051ff35c5d0da1de59f0e3e2a1bc9eeac446488251513bd92606b3f93dde84\",\"config_name\":\"Kavita-linux_armv7_glibc-eb051ff35c5d0da1de59f0e3e2a1bc9eeac446488251513bd92606b3f93dde84\",\"attempt\":3,\"step_ids\":[\"s1\",\"s2\",\"s3\",\"s4\"],\"artifacts\":[\"dist/kavita-linux-armv7.tar\"],\"recipe\":{\"runs_on\":\"ubuntu-latest\",\"steps\":[{\"name\":\"Install QEMU for linux/arm/v7 cross-builds\",\"run\":\"set -e\\nsudo apt-get update\\nsudo apt-get install -y qemu-user-binfmt\\n# Register binfmt handlers for ARM\\nsudo docker run --rm --privileged tonistiigi/binfmt --install arm\",\"shell\":\"bash\"},{\"name\":\"Set up Docker Buildx\",\"run\":\"set -e\\n# Create and use a buildx builder backed by docker-container\\nif ! docker buildx inspect kavita-builder >/dev/null 2>&1; then\\n  docker buildx create --name kavita-builder --driver docker-container --use\\nfi\\ndocker buildx inspect --bootstrap\",\"shell\":\"bash\"},{\"name\":\"Create placeholder _output tarball for Docker build\",\"run\":\"set -e\\nmkdir -p _output tmp_out\\nprintf \\\"Kavita placeholder build artifact\\\\n\\\" > tmp_out/README.txt\\ntar -czf _output/placeholder.tar.gz -C tmp_out .\\nrm -rf tmp_out\\nls -l _output\",\"shell\":\"bash\"},{\"name\":\"Build linux/arm/v7 Docker image and save as tarball\",\"run\":\"set -e\\nIMAGE_REPO=\\\"ghcr.io/kareadita/kavita\\\"\\nIMAGE_TAG=\\\"armv7-local\\\"\\n# Build and load the single-arch image into the local docker daemon\\ndocker buildx build --platform linux/arm/v7 -t \\\"$IMAGE_REPO:$IMAGE_TAG\\\" --load .\\n# Save as artifact tarball\\nmkdir -p dist\\ndocker save -o dist/kavita-linux-armv7.tar \\\"$IMAGE_REPO:$IMAGE_TAG\\\"\",\"shell\":\"bash\"}],\"artifacts\":[\"dist/kavita-linux-armv7.tar\"],\"citations\":{\"steps\":\".github/workflows/release-workflow.yml\"},\"notes\":\"Builds the linux/arm/v7 Docker image using Buildx, creates a minimal _output/*.tar.gz to satisfy the Dockerfile, and saves it as dist/kavita-linux-armv7.tar.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-eb051ff35c5d0da1de59f0e3e2a1bc9eeac446488251513bd92606b3f93dde84",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
