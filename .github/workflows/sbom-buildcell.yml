{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (5e2f14022d2a7b3913b2c0632de887a589fcb1090bd526cc04c7944fe32e9872, paperless-ngx-any_noarch-5e2f14022d2a7b3913b2c0632de887a589fcb1090bd526cc04c7944fe32e9872)",
      "runs-on": "ubuntu-26.04",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "paperless-ngx/paperless-ngx",
            "ref": "19fdc3b815cdcaf0ad869557c45c27ef7d2215b3",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"990be9abe310a01a54ea2d13779aa74a3eef4529\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's 990be9abe310a01a54ea2d13779aa74a3eef4529\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Install pnpm",
          "uses": "pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413",
          "with": {
            "package_json_file": "src-ui/package.json"
          }
        },
        {
          "id": "s2",
          "name": "[recipe] Use Node.js 24",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.x",
            "package-manager-cache": false
          }
        },
        {
          "id": "s3",
          "name": "[recipe] Install frontend dependencies",
          "shell": "bash",
          "run": "cd src-ui && pnpm install"
        },
        {
          "id": "s4",
          "name": "[recipe] Build frontend",
          "shell": "bash",
          "run": "cd src-ui && pnpm run build --configuration production"
        },
        {
          "id": "s5",
          "name": "[recipe] Set up Python",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "id": "s6",
          "name": "[recipe] Install uv",
          "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2",
          "with": {
            "version": "0.13.x",
            "enable-cache": false,
            "python-version": "3.12"
          }
        },
        {
          "id": "s7",
          "name": "[recipe] Install Python dependencies",
          "shell": "bash",
          "run": "uv sync --python \"${PYTHON_VERSION}\" --dev --frozen",
          "env": {
            "PYTHON_VERSION": "3.12"
          }
        },
        {
          "id": "s8",
          "name": "[recipe] Install system dependencies",
          "uses": "$/.github/actions/apt-install",
          "with": {
            "packages": "gettext libleptonica6"
          }
        },
        {
          "id": "s9",
          "name": "[recipe] Build documentation",
          "shell": "bash",
          "run": "uv run \\\n  --python \"${PYTHON_VERSION}\" \\\n  --dev \\\n  --frozen \\\n  zensical build --clean",
          "env": {
            "PYTHON_VERSION": "3.12"
          }
        },
        {
          "id": "s10",
          "name": "[recipe] Generate requirements file",
          "shell": "bash",
          "run": "uv export --quiet --no-dev --all-extras --emit-index-url --format requirements-txt --output-file requirements.txt"
        },
        {
          "id": "s11",
          "name": "[recipe] Compile messages",
          "shell": "bash",
          "run": "cd src/\nuv run \\\n  --python \"${PYTHON_VERSION}\" \\\n  manage.py compilemessages",
          "env": {
            "PAPERLESS_SECRET_KEY": "ci-release-not-a-real-secret",
            "PYTHON_VERSION": "3.12"
          }
        },
        {
          "id": "s12",
          "name": "[recipe] Collect static files",
          "shell": "bash",
          "run": "cd src/\nuv run \\\n  --python \"${PYTHON_VERSION}\" \\\n  manage.py collectstatic --no-input --clear",
          "env": {
            "PAPERLESS_SECRET_KEY": "ci-release-not-a-real-secret",
            "PYTHON_VERSION": "3.12"
          }
        },
        {
          "id": "s13",
          "name": "[recipe] Assemble release package",
          "shell": "bash",
          "run": "mkdir -p dist/paperless-ngx/scripts\n\nfor file_name in .dockerignore \\\n                .env \\\n                Dockerfile \\\n                pyproject.toml \\\n                uv.lock \\\n                requirements.txt \\\n                LICENSE \\\n                README.md \\\n                paperless.conf.example\ndo\n  cp --verbose ${file_name} dist/paperless-ngx/\ndone\nmv dist/paperless-ngx/paperless.conf.example dist/paperless-ngx/paperless.conf\n\ncp --recursive docker/ dist/paperless-ngx/docker\ncp scripts/*.service scripts/*.sh scripts/*.socket dist/paperless-ngx/scripts/\ncp --recursive src/ dist/paperless-ngx/src\ncp --recursive site/ dist/paperless-ngx/docs\nmv static dist/paperless-ngx/\n\nfind dist/paperless-ngx -name \"__pycache__\" -type d -exec rm -rf {} +"
        },
        {
          "id": "s14",
          "name": "[recipe] Create release archive",
          "shell": "bash",
          "run": "cd dist\nsudo chown -R 1000:1000 paperless-ngx/\ntar -cJf paperless-ngx.tar.xz paperless-ngx/"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"991ce48e-9abc-4a62-9ed6-62f59fd0a6ce\",\"content_key\":\"5e2f14022d2a7b3913b2c0632de887a589fcb1090bd526cc04c7944fe32e9872\",\"config_name\":\"paperless-ngx-any_noarch-5e2f14022d2a7b3913b2c0632de887a589fcb1090bd526cc04c7944fe32e9872\",\"attempt\":1,\"step_ids\":[\"s1\",\"s2\",\"s3\",\"s4\",\"s5\",\"s6\",\"s7\",\"s8\",\"s9\",\"s10\",\"s11\",\"s12\",\"s13\",\"s14\"],\"artifacts\":[\"dist/paperless-ngx.tar.xz\"],\"recipe\":{\"runs_on\":\"ubuntu-26.04\",\"steps\":[{\"name\":\"Install pnpm\",\"uses\":\"pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413\",\"with\":{\"package_json_file\":\"src-ui/package.json\"}},{\"name\":\"Use Node.js 24\",\"uses\":\"actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1\",\"with\":{\"node-version\":\"24.x\",\"package-manager-cache\":false}},{\"name\":\"Install frontend dependencies\",\"run\":\"cd src-ui && pnpm install\",\"shell\":\"bash\"},{\"name\":\"Build frontend\",\"run\":\"cd src-ui && pnpm run build --configuration production\",\"shell\":\"bash\"},{\"name\":\"Set up Python\",\"uses\":\"actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0\",\"with\":{\"python-version\":\"3.12\"}},{\"name\":\"Install uv\",\"uses\":\"astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2\",\"with\":{\"version\":\"0.13.x\",\"enable-cache\":false,\"python-version\":\"3.12\"}},{\"name\":\"Install Python dependencies\",\"run\":\"uv sync --python \\\"${PYTHON_VERSION}\\\" --dev --frozen\",\"shell\":\"bash\",\"env\":{\"PYTHON_VERSION\":\"3.12\"}},{\"name\":\"Install system dependencies\",\"uses\":\"$/.github/actions/apt-install\",\"with\":{\"packages\":\"gettext libleptonica6\"}},{\"name\":\"Build documentation\",\"run\":\"uv run \\\\\\n  --python \\\"${PYTHON_VERSION}\\\" \\\\\\n  --dev \\\\\\n  --frozen \\\\\\n  zensical build --clean\",\"shell\":\"bash\",\"env\":{\"PYTHON_VERSION\":\"3.12\"}},{\"name\":\"Generate requirements file\",\"run\":\"uv export --quiet --no-dev --all-extras --emit-index-url --format requirements-txt --output-file requirements.txt\",\"shell\":\"bash\"},{\"name\":\"Compile messages\",\"run\":\"cd src/\\nuv run \\\\\\n  --python \\\"${PYTHON_VERSION}\\\" \\\\\\n  manage.py compilemessages\",\"shell\":\"bash\",\"env\":{\"PAPERLESS_SECRET_KEY\":\"ci-release-not-a-real-secret\",\"PYTHON_VERSION\":\"3.12\"}},{\"name\":\"Collect static files\",\"run\":\"cd src/\\nuv run \\\\\\n  --python \\\"${PYTHON_VERSION}\\\" \\\\\\n  manage.py collectstatic --no-input --clear\",\"shell\":\"bash\",\"env\":{\"PAPERLESS_SECRET_KEY\":\"ci-release-not-a-real-secret\",\"PYTHON_VERSION\":\"3.12\"}},{\"name\":\"Assemble release package\",\"run\":\"mkdir -p dist/paperless-ngx/scripts\\n\\nfor file_name in .dockerignore \\\\\\n                .env \\\\\\n                Dockerfile \\\\\\n                pyproject.toml \\\\\\n                uv.lock \\\\\\n                requirements.txt \\\\\\n                LICENSE \\\\\\n                README.md \\\\\\n                paperless.conf.example\\ndo\\n  cp --verbose ${file_name} dist/paperless-ngx/\\ndone\\nmv dist/paperless-ngx/paperless.conf.example dist/paperless-ngx/paperless.conf\\n\\ncp --recursive docker/ dist/paperless-ngx/docker\\ncp scripts/*.service scripts/*.sh scripts/*.socket dist/paperless-ngx/scripts/\\ncp --recursive src/ dist/paperless-ngx/src\\ncp --recursive site/ dist/paperless-ngx/docs\\nmv static dist/paperless-ngx/\\n\\nfind dist/paperless-ngx -name \\\"__pycache__\\\" -type d -exec rm -rf {} +\",\"shell\":\"bash\"},{\"name\":\"Create release archive\",\"run\":\"cd dist\\nsudo chown -R 1000:1000 paperless-ngx/\\ntar -cJf paperless-ngx.tar.xz paperless-ngx/\",\"shell\":\"bash\"}],\"artifacts\":[\"dist/paperless-ngx.tar.xz\"],\"citations\":{\"steps\":\".github/workflows/ci-release.yml\"},\"notes\":\"Builds frontend and backend assets, assembles the release directory, and creates dist/paperless-ngx.tar.xz.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-5e2f14022d2a7b3913b2c0632de887a589fcb1090bd526cc04c7944fe32e9872",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
