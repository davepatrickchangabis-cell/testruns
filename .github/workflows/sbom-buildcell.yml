{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (4ff42b4c9028376cd4e02372a778f88195e4a5f74972dd56f0117dc558d907aa, avenOS-android_arm64-4ff42b4c9028376cd4e02372a778f88195e4a5f74972dd56f0117dc558d907aa)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "MyAvenCEO/avenOS",
            "ref": "8310bc3fbb31453323b38af70425793af515d752",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"0219feb59347dcb0d6f44c51a909d66b061e5c4a\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's 0219feb59347dcb0d6f44c51a909d66b061e5c4a\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Setup Bun",
          "uses": "oven-sh/setup-bun@v2",
          "with": {
            "bun-version": "1.3.13"
          }
        },
        {
          "id": "s2",
          "name": "[recipe] Setup Java 17 (Temurin) with Gradle cache",
          "uses": "actions/setup-java@v6",
          "with": {
            "cache": "gradle",
            "distribution": "temurin",
            "java-version": "17",
            "cache-dependency-path": "app/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties\napp/src-tauri/gen/android/**/*.gradle*"
          }
        },
        {
          "id": "s3",
          "name": "[recipe] Setup Android SDK platform-tools",
          "uses": "android-actions/setup-android@v4",
          "with": {
            "packages": "platform-tools"
          }
        },
        {
          "id": "s4",
          "name": "[recipe] Install Android platform, build-tools, and NDK",
          "shell": "bash",
          "run": "sdkmanager 'platforms;android-36' 'build-tools;36.0.0' \"ndk;$ANDROID_NDK_VERSION\"",
          "env": {
            "ANDROID_NDK_VERSION": "27.2.12479018"
          }
        },
        {
          "id": "s5",
          "name": "[recipe] Setup Rust 1.93.1 target aarch64-linux-android",
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "targets": "aarch64-linux-android",
            "toolchain": "1.93.1"
          }
        },
        {
          "id": "s6",
          "name": "[recipe] Configure GitHub Packages auth and install JS dependencies with bun",
          "shell": "bash",
          "run": "set -euo pipefail\necho \"@myavenceo:registry=https://npm.pkg.github.com\" > .npmrc\necho \"//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}\" >> .npmrc\nbun install --frozen-lockfile"
        },
        {
          "id": "s7",
          "name": "[recipe] Build Android ARM64 client",
          "shell": "bash",
          "run": "NDK_HOME=\"$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION\" bun scripts/build-client-release.ts android-arm64",
          "env": {
            "ANDROID_NDK_VERSION": "27.2.12479018"
          }
        },
        {
          "id": "s8",
          "name": "[recipe] Verify signature, alignment, ABI, package identity, and version",
          "shell": "bash",
          "run": "set -euo pipefail\napk=(dist/client-release/*-debug.apk)\ntest \"${#apk[@]}\" -eq 1\n\"$ANDROID_HOME/build-tools/36.0.0/apksigner\" verify --verbose --print-certs \"${apk[0]}\"\n\"$ANDROID_HOME/build-tools/36.0.0/zipalign\" -c -P 16 4 \"${apk[0]}\"\n\"$ANDROID_HOME/build-tools/36.0.0/aapt\" dump badging \"${apk[0]}\" > \"$RUNNER_TEMP/apk-info.txt\"\ngrep -q \"package: name='ceo.aven.os'\" \"$RUNNER_TEMP/apk-info.txt\"\ngrep -q \"versionCode='$CLIENT_ANDROID_VERSION_CODE'\" \"$RUNNER_TEMP/apk-info.txt\"\ngrep -q \"native-code: 'arm64-v8a'\" \"$RUNNER_TEMP/apk-info.txt\"\ngrep -q \"sdkVersion:'28'\" \"$RUNNER_TEMP/apk-info.txt\"\nunzip -Z1 \"${apk[0]}\" > \"$RUNNER_TEMP/apk-files.txt\"\nif grep -E '^assets/onnxruntime/(lib|ONNXRuntime-)' \"$RUNNER_TEMP/apk-files.txt\"; then exit 1; fi"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"1a2b0d50-8a09-48e7-98d7-6af9c7452201\",\"content_key\":\"4ff42b4c9028376cd4e02372a778f88195e4a5f74972dd56f0117dc558d907aa\",\"config_name\":\"avenOS-android_arm64-4ff42b4c9028376cd4e02372a778f88195e4a5f74972dd56f0117dc558d907aa\",\"attempt\":3,\"step_ids\":[\"s1\",\"s2\",\"s3\",\"s4\",\"s5\",\"s6\",\"s7\",\"s8\"],\"artifacts\":[\"dist/client-release/*-debug.apk\"],\"recipe\":{\"runs_on\":\"ubuntu-24.04\",\"steps\":[{\"name\":\"Setup Bun\",\"uses\":\"oven-sh/setup-bun@v2\",\"with\":{\"bun-version\":\"1.3.13\"}},{\"name\":\"Setup Java 17 (Temurin) with Gradle cache\",\"uses\":\"actions/setup-java@v6\",\"with\":{\"cache\":\"gradle\",\"distribution\":\"temurin\",\"java-version\":\"17\",\"cache-dependency-path\":\"app/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties\\napp/src-tauri/gen/android/**/*.gradle*\"}},{\"name\":\"Setup Android SDK platform-tools\",\"uses\":\"android-actions/setup-android@v4\",\"with\":{\"packages\":\"platform-tools\"}},{\"name\":\"Install Android platform, build-tools, and NDK\",\"run\":\"sdkmanager 'platforms;android-36' 'build-tools;36.0.0' \\\"ndk;$ANDROID_NDK_VERSION\\\"\",\"shell\":\"bash\",\"env\":{\"ANDROID_NDK_VERSION\":\"27.2.12479018\"}},{\"name\":\"Setup Rust 1.93.1 target aarch64-linux-android\",\"uses\":\"dtolnay/rust-toolchain@stable\",\"with\":{\"targets\":\"aarch64-linux-android\",\"toolchain\":\"1.93.1\"}},{\"name\":\"Configure GitHub Packages auth and install JS dependencies with bun\",\"run\":\"set -euo pipefail\\necho \\\"@myavenceo:registry=https://npm.pkg.github.com\\\" > .npmrc\\necho \\\"//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}\\\" >> .npmrc\\nbun install --frozen-lockfile\",\"shell\":\"bash\"},{\"name\":\"Build Android ARM64 client\",\"run\":\"NDK_HOME=\\\"$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION\\\" bun scripts/build-client-release.ts android-arm64\",\"shell\":\"bash\",\"env\":{\"ANDROID_NDK_VERSION\":\"27.2.12479018\"}},{\"name\":\"Verify signature, alignment, ABI, package identity, and version\",\"run\":\"set -euo pipefail\\napk=(dist/client-release/*-debug.apk)\\ntest \\\"${#apk[@]}\\\" -eq 1\\n\\\"$ANDROID_HOME/build-tools/36.0.0/apksigner\\\" verify --verbose --print-certs \\\"${apk[0]}\\\"\\n\\\"$ANDROID_HOME/build-tools/36.0.0/zipalign\\\" -c -P 16 4 \\\"${apk[0]}\\\"\\n\\\"$ANDROID_HOME/build-tools/36.0.0/aapt\\\" dump badging \\\"${apk[0]}\\\" > \\\"$RUNNER_TEMP/apk-info.txt\\\"\\ngrep -q \\\"package: name='ceo.aven.os'\\\" \\\"$RUNNER_TEMP/apk-info.txt\\\"\\ngrep -q \\\"versionCode='$CLIENT_ANDROID_VERSION_CODE'\\\" \\\"$RUNNER_TEMP/apk-info.txt\\\"\\ngrep -q \\\"native-code: 'arm64-v8a'\\\" \\\"$RUNNER_TEMP/apk-info.txt\\\"\\ngrep -q \\\"sdkVersion:'28'\\\" \\\"$RUNNER_TEMP/apk-info.txt\\\"\\nunzip -Z1 \\\"${apk[0]}\\\" > \\\"$RUNNER_TEMP/apk-files.txt\\\"\\nif grep -E '^assets/onnxruntime/(lib|ONNXRuntime-)' \\\"$RUNNER_TEMP/apk-files.txt\\\"; then exit 1; fi\",\"shell\":\"bash\"}],\"artifacts\":[\"dist/client-release/*-debug.apk\"],\"citations\":{\"steps\":\".github/workflows/client-release.yml\"},\"notes\":\"Authenticate to GitHub Packages via GITHUB_TOKEN before running bun install to build and verify the Android ARM64 debug APK.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-4ff42b4c9028376cd4e02372a778f88195e4a5f74972dd56f0117dc558d907aa",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
