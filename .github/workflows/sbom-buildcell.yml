{
  "name": "abis build cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (bf868604dbc4553901ea33b78c3a0259f4c114e98b7fceaa7448e666aa82b22c, Kavita-windows_x86_64-bf868604dbc4553901ea33b78c3a0259f4c114e98b7fceaa7448e666aa82b22c)",
      "runs-on": "windows-latest",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "Kareadita/Kavita",
            "ref": "c78f8a8ba5d5870333b1b708e8f23f66ca03041f",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot",
          "shell": "bash",
          "run": "tree=$(git rev-parse 'HEAD^{tree}')\necho \"checkout tree $tree\"\nif [ \"$tree\" != \"f00a1a0226591510c85d2d62ec019e6c21bfc35f\" ]; then\n  echo \"::error::the checkout's tree $tree is not the snapshot's f00a1a0226591510c85d2d62ec019e6c21bfc35f\"\n  exit 12\nfi"
        },
        {
          "id": "s1",
          "name": "[recipe] Build and package watchprobe (win-x64)",
          "shell": "bash",
          "run": "#!/usr/bin/env bash\nset -euo pipefail\nname=\"watchprobe\"\nrid=\"win-x64\"\n\n# Find the watchprobe project file\nproj=\"\"\nwhile IFS= read -r f; do\n  base=\"$(basename \"$f\")\"\n  if [[ \"${base,,}\" == \"watchprobe.csproj\" ]]; then proj=\"$f\"; break; fi\ndone < <(git ls-files \"*.csproj\")\n\nif [[ -z \"$proj\" ]]; then\n  while IFS= read -r f; do\n    low=\"${f,,}\"\n    if [[ \"$low\" == *\"watchprobe\"*\".csproj\" ]]; then proj=\"$f\"; break; fi\n  done < <(git ls-files \"*.csproj\")\nfi\n\nif [[ -z \"$proj\" ]]; then\n  while IFS= read -r f; do\n    if grep -qi '<AssemblyName>.*watchprobe.*</AssemblyName>' \"$f\"; then proj=\"$f\"; break; fi\n  done < <(git ls-files \"*.csproj\")\nfi\n\nif [[ -z \"$proj\" ]]; then\n  echo \"::error::Could not find a watchprobe .csproj in the repository\" >&2\n  exit 2\nfi\n\necho \"Using project: $proj\"\n\n# Determine a README to include\nproj_dir=\"$(cd \"$(dirname \"$proj\")\" && pwd)\"\nreadme=\"\"\nfor candidate in \"$proj_dir/README.md\" \"$proj_dir/Readme.md\" \"$proj_dir/readme.md\" \"$(pwd)/README.md\"; do\n  if [[ -f \"$candidate\" ]]; then readme=\"$candidate\"; break; fi\ndone\nif [[ -z \"$readme\" ]]; then\n  tmp_readme=\"${TMP:-/tmp}/readme_watchprobe.md\"\n  printf \"%s\\n\" \"watchprobe\" > \"$tmp_readme\"\n  readme=\"$tmp_readme\"\nfi\n\n# Publish to the expected output folder\nout=\"watchprobe/dist/$name-$rid\"\nmkdir -p \"$out\"\n\ndotnet publish \"$proj\" -c Release -r \"$rid\" -o \"$out\" -v q\ncp \"$readme\" \"$out/README.md\"\n\n# Create the zip at the expected path\n( cd \"watchprobe/dist\" && {\n    if command -v zip >/dev/null 2>&1; then\n      zip -qr \"$name-$rid.zip\" \"$name-$rid\"\n    else\n      /c/Windows/System32/tar.exe -a -cf \"$name-$rid.zip\" \"$name-$rid\"\n    fi\n  }\n)\n\nls -l watchprobe/dist/*.zip"
        },
        {
          "name": "Measure what the build produced",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_STEPS": "${{ toJSON(steps) }}",
            "ABIS_OUT": "${{ runner.temp }}/abis/out",
            "ABIS_SPEC": "{\"run_id\":\"ba8636a0-0600-41a6-9483-27ec599b0224\",\"content_key\":\"bf868604dbc4553901ea33b78c3a0259f4c114e98b7fceaa7448e666aa82b22c\",\"config_name\":\"Kavita-windows_x86_64-bf868604dbc4553901ea33b78c3a0259f4c114e98b7fceaa7448e666aa82b22c\",\"attempt\":2,\"step_ids\":[\"s1\"],\"artifacts\":[\"watchprobe/dist/watchprobe-win-x64.zip\"],\"recipe\":{\"runs_on\":\"windows-latest\",\"steps\":[{\"name\":\"Build and package watchprobe (win-x64)\",\"run\":\"#!/usr/bin/env bash\\nset -euo pipefail\\nname=\\\"watchprobe\\\"\\nrid=\\\"win-x64\\\"\\n\\n# Find the watchprobe project file\\nproj=\\\"\\\"\\nwhile IFS= read -r f; do\\n  base=\\\"$(basename \\\"$f\\\")\\\"\\n  if [[ \\\"${base,,}\\\" == \\\"watchprobe.csproj\\\" ]]; then proj=\\\"$f\\\"; break; fi\\ndone < <(git ls-files \\\"*.csproj\\\")\\n\\nif [[ -z \\\"$proj\\\" ]]; then\\n  while IFS= read -r f; do\\n    low=\\\"${f,,}\\\"\\n    if [[ \\\"$low\\\" == *\\\"watchprobe\\\"*\\\".csproj\\\" ]]; then proj=\\\"$f\\\"; break; fi\\n  done < <(git ls-files \\\"*.csproj\\\")\\nfi\\n\\nif [[ -z \\\"$proj\\\" ]]; then\\n  while IFS= read -r f; do\\n    if grep -qi '<AssemblyName>.*watchprobe.*</AssemblyName>' \\\"$f\\\"; then proj=\\\"$f\\\"; break; fi\\n  done < <(git ls-files \\\"*.csproj\\\")\\nfi\\n\\nif [[ -z \\\"$proj\\\" ]]; then\\n  echo \\\"::error::Could not find a watchprobe .csproj in the repository\\\" >&2\\n  exit 2\\nfi\\n\\necho \\\"Using project: $proj\\\"\\n\\n# Determine a README to include\\nproj_dir=\\\"$(cd \\\"$(dirname \\\"$proj\\\")\\\" && pwd)\\\"\\nreadme=\\\"\\\"\\nfor candidate in \\\"$proj_dir/README.md\\\" \\\"$proj_dir/Readme.md\\\" \\\"$proj_dir/readme.md\\\" \\\"$(pwd)/README.md\\\"; do\\n  if [[ -f \\\"$candidate\\\" ]]; then readme=\\\"$candidate\\\"; break; fi\\ndone\\nif [[ -z \\\"$readme\\\" ]]; then\\n  tmp_readme=\\\"${TMP:-/tmp}/readme_watchprobe.md\\\"\\n  printf \\\"%s\\\\n\\\" \\\"watchprobe\\\" > \\\"$tmp_readme\\\"\\n  readme=\\\"$tmp_readme\\\"\\nfi\\n\\n# Publish to the expected output folder\\nout=\\\"watchprobe/dist/$name-$rid\\\"\\nmkdir -p \\\"$out\\\"\\n\\ndotnet publish \\\"$proj\\\" -c Release -r \\\"$rid\\\" -o \\\"$out\\\" -v q\\ncp \\\"$readme\\\" \\\"$out/README.md\\\"\\n\\n# Create the zip at the expected path\\n( cd \\\"watchprobe/dist\\\" && {\\n    if command -v zip >/dev/null 2>&1; then\\n      zip -qr \\\"$name-$rid.zip\\\" \\\"$name-$rid\\\"\\n    else\\n      /c/Windows/System32/tar.exe -a -cf \\\"$name-$rid.zip\\\" \\\"$name-$rid\\\"\\n    fi\\n  }\\n)\\n\\nls -l watchprobe/dist/*.zip\",\"shell\":\"bash\"}],\"artifacts\":[\"watchprobe/dist/watchprobe-win-x64.zip\"],\"citations\":{\"steps\":\"scripts/ProbeCommon/publish.sh\"},\"notes\":\"Builds the watchprobe app for win-x64 by locating its .csproj, publishing to watchprobe/dist, and zipping the result to the expected path.\"}}"
          },
          "run": "import glob, hashlib, json, os, tarfile\nout = os.environ[\"ABIS_OUT\"]\nos.makedirs(out, exist_ok=True)\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\norder = [\"abis_gate\"] + spec[\"step_ids\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nws = os.environ.get(\"GITHUB_WORKSPACE\", \".\")\nartifacts, missing = [], []\nfor pattern in spec[\"artifacts\"]:\n    hits = sorted(p for p in glob.glob(os.path.join(ws, pattern), recursive=True) if os.path.isfile(p))\n    if not hits:\n        missing.append(pattern)\n    for p in hits[:200]:\n        h = hashlib.sha256()\n        with open(p, \"rb\") as f:\n            for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n                h.update(chunk)\n        artifacts.append({\"pattern\": pattern, \"path\": os.path.relpath(p, ws).replace(os.sep, \"/\"),\n                          \"sha256\": h.hexdigest(), \"bytes\": os.path.getsize(p)})\nran = all(outcomes[i] == \"success\" for i in order)\nresult = {\"schema\": \"abis-buildcell-result/1\", \"run_id\": spec[\"run_id\"], \"content_key\": spec[\"content_key\"],\n          \"config_name\": spec[\"config_name\"], \"attempt\": spec[\"attempt\"], \"steps\": outcomes,\n          \"failed_step\": failed, \"artifacts\": artifacts, \"missing\": missing,\n          \"built\": ran and bool(artifacts) and not missing}\nwith open(os.path.join(out, \"result.json\"), \"w\") as f:\n    json.dump(result, f, indent=2)\nwith open(os.path.join(out, \"recipe.json\"), \"w\") as f:\n    json.dump(spec[\"recipe\"], f, indent=2)\nwith tarfile.open(os.path.join(os.path.dirname(out), \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps(result, indent=2))\n"
        },
        {
          "name": "Upload the evidence bundle",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "bundle-bf868604dbc4553901ea33b78c3a0259f4c114e98b7fceaa7448e666aa82b22c",
            "path": "${{ runner.temp }}/abis/bundle.tar.gz",
            "compression-level": 0,
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
