{
  "name": "abis prove cell",
  "run-name": "abis ${{ inputs.abis_run_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "abis_run_id": {
          "description": "ABIS run id. Everything else is in this file.",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "abis-${{ inputs.abis_run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "cell": {
      "name": "cell (5e2f14022d2a7b3913b2c0632de887a589fcb1090bd526cc04c7944fe32e9872, paperless-ngx-any_noarch-5e2f14022d2a7b3913b2c0632de887a589fcb1090bd526cc04c7944fe32e9872)",
      "runs-on": "ubuntu-26.04",
      "timeout-minutes": 180,
      "env": {
        "MSBUILDDISABLENODEREUSE": "1",
        "DOTNET_CLI_USE_MSBUILD_SERVER": "0",
        "UseSharedCompilation": "false"
      },
      "steps": [
        {
          "name": "Keep line endings as committed",
          "shell": "bash",
          "run": "git config --global core.autocrlf false"
        },
        {
          "name": "Check out this run's files",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.ref }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Check out the target at its pinned commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "paperless-ngx/paperless-ngx",
            "ref": "19fdc3b815cdcaf0ad869557c45c27ef7d2215b3",
            "path": "paperless-ngx",
            "submodules": "recursive",
            "persist-credentials": false
          }
        },
        {
          "id": "abis_scanner_python",
          "name": "Set up Python for the scanner",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.12",
            "update-environment": false
          }
        },
        {
          "id": "abis_gate",
          "name": "Prove the checkout is the snapshot and the scanner is the pinned one",
          "shell": "bash",
          "run": "\"$ABIS_SCANNER_PYTHON\" -c \"$ABIS_SCANNER_SCRIPT\"",
          "env": {
            "ABIS_SPEC": "{\"run_id\":\"9f04242d-67cc-4277-b71e-e25a5b4088d6\",\"build_id\":\"fa3262af-a174-4c03-9869-2fec9d2b2017\",\"content_key\":\"5e2f14022d2a7b3913b2c0632de887a589fcb1090bd526cc04c7944fe32e9872\",\"config_name\":\"paperless-ngx-any_noarch-5e2f14022d2a7b3913b2c0632de887a589fcb1090bd526cc04c7944fe32e9872\",\"commit\":\"19fdc3b815cdcaf0ad869557c45c27ef7d2215b3\",\"tree\":\"990be9abe310a01a54ea2d13779aa74a3eef4529\",\"target\":\"paperless-ngx\",\"repo_id\":\"paperless-ngx\",\"repo_name\":\"paperless-ngx\",\"buildscan_sha256\":\"9ca2940256601fb656dddfa1d65938f0981b256b17b0b4501acb07ff280de89d\",\"setup_ids\":[\"u1\",\"u2\",\"u3\",\"u4\",\"abis_prepared_files\"],\"step_names\":{\"u1\":\"Install pnpm\",\"u2\":\"Use Node.js 24\",\"u3\":\"Set up Python\",\"u4\":\"Install uv\",\"abis_prepared_files\":\"measure preparation outputs\"},\"step6_artifacts\":[{\"path\":\"dist/paperless-ngx.tar.xz\",\"bytes\":332505952,\"sha256\":\"8d550dcc87583d7a689e59ce7c85c27bdec0e8d3bdb51d0bf06a7829faf0bc94\",\"pattern\":\"dist/paperless-ngx.tar.xz\"}]}",
            "ABIS_SCANNER_PYTHON": "${{ steps.abis_scanner_python.outputs.python-path }}",
            "ABIS_SCANNER_SCRIPT": "import hashlib, json, os, subprocess, sys\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\nws = os.environ[\"GITHUB_WORKSPACE\"]\ntmp = os.path.join(os.environ[\"RUNNER_TEMP\"], \"abis\")\nos.makedirs(tmp, exist_ok=True)\ntree = subprocess.run([\"git\", \"-C\", os.path.join(ws, spec[\"target\"]), \"rev-parse\", \"HEAD^{tree}\"],\n                      capture_output=True, text=True).stdout.strip()\nh = hashlib.sha256()\nwith open(os.path.join(ws, \"abis\", \"bin\", \"abis-buildscan.pyz\"), \"rb\") as f:\n    for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n        h.update(chunk)\ngate = {\"tree\": tree, \"snapshot_tree\": spec[\"tree\"],\n        \"buildscan_sha256\": h.hexdigest(), \"pinned_buildscan_sha256\": spec[\"buildscan_sha256\"]}\nwith open(os.path.join(tmp, \"gate.json\"), \"w\") as f:\n    json.dump(gate, f, indent=2)\nprint(json.dumps(gate, indent=2))\nif tree != spec[\"tree\"]:\n    print(\"::error::the checkout's tree \" + tree + \" is not the snapshot's \" + spec[\"tree\"])\n    sys.exit(12)\nif gate[\"buildscan_sha256\"] != spec[\"buildscan_sha256\"]:\n    print(\"::error::abis-buildscan.pyz is not the pinned one\")\n    sys.exit(10)\n"
          }
        },
        {
          "id": "u1",
          "name": "[recipe] Install pnpm",
          "uses": "pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413",
          "with": {
            "package_json_file": "src-ui/package.json"
          }
        },
        {
          "id": "u2",
          "name": "[recipe] Use Node.js 24",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.x",
            "package-manager-cache": false
          }
        },
        {
          "id": "u3",
          "name": "[recipe] Set up Python",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "id": "u4",
          "name": "[recipe] Install uv",
          "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2",
          "with": {
            "version": "0.13.x",
            "enable-cache": false,
            "python-version": "3.12"
          }
        },
        {
          "id": "abis_prepared_files",
          "name": "Measure untraced preparation outputs",
          "shell": "python",
          "env": {
            "ABIS_SPEC": "{\"run_id\":\"9f04242d-67cc-4277-b71e-e25a5b4088d6\",\"build_id\":\"fa3262af-a174-4c03-9869-2fec9d2b2017\",\"content_key\":\"5e2f14022d2a7b3913b2c0632de887a589fcb1090bd526cc04c7944fe32e9872\",\"config_name\":\"paperless-ngx-any_noarch-5e2f14022d2a7b3913b2c0632de887a589fcb1090bd526cc04c7944fe32e9872\",\"commit\":\"19fdc3b815cdcaf0ad869557c45c27ef7d2215b3\",\"tree\":\"990be9abe310a01a54ea2d13779aa74a3eef4529\",\"target\":\"paperless-ngx\",\"repo_id\":\"paperless-ngx\",\"repo_name\":\"paperless-ngx\",\"buildscan_sha256\":\"9ca2940256601fb656dddfa1d65938f0981b256b17b0b4501acb07ff280de89d\",\"setup_ids\":[\"u1\",\"u2\",\"u3\",\"u4\",\"abis_prepared_files\"],\"step_names\":{\"u1\":\"Install pnpm\",\"u2\":\"Use Node.js 24\",\"u3\":\"Set up Python\",\"u4\":\"Install uv\",\"abis_prepared_files\":\"measure preparation outputs\"},\"step6_artifacts\":[{\"path\":\"dist/paperless-ngx.tar.xz\",\"bytes\":332505952,\"sha256\":\"8d550dcc87583d7a689e59ce7c85c27bdec0e8d3bdb51d0bf06a7829faf0bc94\",\"pattern\":\"dist/paperless-ngx.tar.xz\"}]}"
          },
          "run": "import hashlib, json, os, subprocess\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\nws = os.environ[\"GITHUB_WORKSPACE\"]\nrepo = os.path.join(ws, spec[\"target\"])\nproof = os.path.join(ws, \"abis\", \"proof\", \"prepared-files.json\")\n\ndef paths(*args):\n    raw = subprocess.check_output([\"git\", \"-C\", repo, *args])\n    return [p.decode(\"utf-8\", \"surrogateescape\") for p in raw.split(b\"\\0\") if p]\n\nchanged = set(paths(\"diff\", \"--name-only\", \"-z\"))\nchanged.update(paths(\"ls-files\", \"--others\", \"--ignored\", \"--exclude-standard\", \"-z\"))\nfiles = []\nfor rel in sorted(changed):\n    path = os.path.realpath(os.path.join(repo, rel))\n    if not path.startswith(os.path.realpath(repo) + os.sep) or not os.path.isfile(path):\n        continue\n    h = hashlib.sha256()\n    with open(path, \"rb\") as fh:\n        for chunk in iter(lambda: fh.read(1 << 20), b\"\"):\n            h.update(chunk)\n    files.append({\"path\": rel.replace(os.sep, \"/\"), \"sha256\": h.hexdigest()})\nwith open(proof, \"w\", encoding=\"utf-8\") as fh:\n    json.dump({\"schema\": \"abis-prepared-files/1\", \"files\": files}, fh, indent=2)\nprint(\"[prepared] measured %d source-tree file(s)\" % len(files), flush=True)\n"
        },
        {
          "id": "abis_prove",
          "name": "Traced build, reduction, rebuild (abis-buildscan)",
          "shell": "bash",
          "run": "\"$ABIS_SCANNER_PYTHON\" -c \"$ABIS_SCANNER_SCRIPT\"",
          "env": {
            "ABIS_SPEC": "{\"run_id\":\"9f04242d-67cc-4277-b71e-e25a5b4088d6\",\"build_id\":\"fa3262af-a174-4c03-9869-2fec9d2b2017\",\"content_key\":\"5e2f14022d2a7b3913b2c0632de887a589fcb1090bd526cc04c7944fe32e9872\",\"config_name\":\"paperless-ngx-any_noarch-5e2f14022d2a7b3913b2c0632de887a589fcb1090bd526cc04c7944fe32e9872\",\"commit\":\"19fdc3b815cdcaf0ad869557c45c27ef7d2215b3\",\"tree\":\"990be9abe310a01a54ea2d13779aa74a3eef4529\",\"target\":\"paperless-ngx\",\"repo_id\":\"paperless-ngx\",\"repo_name\":\"paperless-ngx\",\"buildscan_sha256\":\"9ca2940256601fb656dddfa1d65938f0981b256b17b0b4501acb07ff280de89d\",\"setup_ids\":[\"u1\",\"u2\",\"u3\",\"u4\",\"abis_prepared_files\"],\"step_names\":{\"u1\":\"Install pnpm\",\"u2\":\"Use Node.js 24\",\"u3\":\"Set up Python\",\"u4\":\"Install uv\",\"abis_prepared_files\":\"measure preparation outputs\"},\"step6_artifacts\":[{\"path\":\"dist/paperless-ngx.tar.xz\",\"bytes\":332505952,\"sha256\":\"8d550dcc87583d7a689e59ce7c85c27bdec0e8d3bdb51d0bf06a7829faf0bc94\",\"pattern\":\"dist/paperless-ngx.tar.xz\"}]}",
            "ABIS_SCANNER_PYTHON": "${{ steps.abis_scanner_python.outputs.python-path }}",
            "ABIS_SCANNER_SCRIPT": "import json, os, shutil, subprocess, sys\n\nVCS = (\".git\", \".hg\", \".svn\")\ndef hide_vcs(repo, keep):\n    moved = []\n    for root, dirs, files in os.walk(repo):\n        for name in VCS:\n            if name in dirs or name in files:\n                src = os.path.join(root, name)\n                dst = os.path.join(keep, os.path.relpath(src, repo))\n                os.makedirs(os.path.dirname(dst), exist_ok=True)\n                shutil.move(src, dst)\n                moved.append((src, dst))\n        dirs[:] = [d for d in dirs if d not in VCS]\n    print(\"[vcs] moved %d VCS director%s aside for the trace\" % (len(moved), \"y\" if len(moved) == 1 else \"ies\"), flush=True)\n    return moved\ndef restore_vcs(moved):\n    for src, dst in reversed(moved):\n        shutil.move(dst, src)\nfor stream in (sys.stdout, sys.stderr):\n    stream.reconfigure(encoding=\"utf-8\", errors=\"replace\")\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\nws = os.environ[\"GITHUB_WORKSPACE\"]\ntmp = os.path.join(os.environ[\"RUNNER_TEMP\"], \"abis\")\nos.makedirs(tmp, exist_ok=True)\nproof = os.path.join(ws, \"abis\", \"proof\")\nenv = dict(os.environ)\n# The scanner must not choose the interpreter that runs the proven recipe.\n# Its setup action deliberately leaves the job environment alone; a recipe\n# setup action may then select its own Python.  This outer process stays the\n# pinned scanner Python while the recipe uses the selected Python executable.\nrecipe_python = shutil.which(\"python\") or sys.executable\n# setup-python can add its lib directory after this workflow was rendered.\n# Do not let that override the runner's C++ runtime while NumPy loads an\n# extension.  Pop here as well as on the workflow step: this is the exact\n# environment inherited by buildscan and the recipe driver.\nenv.pop(\"LD_LIBRARY_PATH\", None)\n# ABIS_PYTHON is called for both build and test phases.  Put a transparent\n# driver in front of it so a failed native import retains the interpreter,\n# loader variables, and actual library resolution in the evidence bundle.\n# ldd runs only on an extension the build has already written; it does not\n# execute the extension.  This is needed because an empty LD_LIBRARY_PATH did\n# not, by itself, identify the libstdc++ which supplied NumPy's missing ABI.\nruntime_driver = os.path.join(proof, \"runtime-driver.py\")\nwith open(runtime_driver, \"w\", encoding=\"utf-8\") as f:\n    f.write(r'''#! /usr/bin/env python3\nimport glob, os, subprocess, sys\nlog = os.environ[\"ABIS_RUNTIME_LOG\"]\nreal = os.environ[\"ABIS_RECIPE_PYTHON\"]\nwith open(log, \"a\", encoding=\"utf-8\") as out:\n    def record(args, contains=None):\n        out.write(\"[runtime] \" + \" \".join(args) + \"\\\\n\")\n        try:\n            p = subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)\n        except OSError as e:\n            out.write(\"[runtime] could not run: \" + str(e) + \"\\\\n\")\n            return\n        lines = p.stdout.splitlines()\n        if contains is not None:\n            lines = [line for line in lines if contains in line]\n            if not lines:\n                out.write(\"[runtime] no output containing \" + contains + \"\\\\n\")\n        out.write(\"\\\\n\".join(lines) + (\"\\\\n\" if lines else \"\"))\n        out.write(\"[runtime] exit=\" + str(p.returncode) + \"\\\\n\")\n\n    out.write(\"[runtime] executable=\" + real + \"\\\\n\")\n    out.write(\"[runtime] argv=\" + repr(sys.argv[1:]) + \"\\\\n\")\n    for name in (\"LD_LIBRARY_PATH\", \"LD_PRELOAD\", \"PATH\"):\n        out.write(\"[runtime] \" + name + \"=\" + os.environ.get(name, \"\") + \"\\\\n\")\n    for ext in sorted(glob.glob(os.path.join(os.getcwd(), \"build-install\", \"**\", \"_multiarray_umath*.so\"), recursive=True)):\n        record([\"readelf\", \"-d\", ext])\n        record([\"readelf\", \"-Ws\", ext], \"__si_class_type_info\")\n        record([\"ldd\", ext])\n    build_dir = os.path.join(os.getcwd(), \"build\")\n    if os.path.isdir(build_dir):\n        record([\"ninja\", \"-C\", build_dir, \"-t\", \"commands\"], \"_multiarray_umath\")\nos.execvpe(real, [real, *sys.argv[1:]], os.environ)\n''')\nos.chmod(runtime_driver, 0o755)\nenv.update({\"ABIS_PYTHON\": runtime_driver, \"ABIS_RECIPE_PYTHON\": recipe_python,\n            \"ABIS_RUNTIME_LOG\": os.path.join(tmp, \"runtime-diagnostics.log\"),\n            \"ABIS_RECIPE\": os.path.join(proof, \"recipe.py\"),\n            \"ABIS_RECIPE_STEPS\": os.path.join(proof, \"steps.json\"),\n            \"LINEAGE_PREPARED_FILES\": os.path.join(proof, \"prepared-files.json\"),\n            \"PYTHONIOENCODING\": \"utf-8\"})\ncmd = [sys.executable, os.path.join(ws, \"abis\", \"bin\", \"abis-buildscan.pyz\"),\n       \"--repo\", os.path.join(ws, spec[\"target\"]), \"--repo-id\", spec[\"repo_id\"],\n       \"--repo-name\", spec[\"repo_name\"], \"--config-name\", spec[\"config_name\"],\n       \"--external-config\", os.path.join(proof, \"config.json\"),\n       \"--commit\", spec[\"commit\"], \"--no-cache\", \"--out\", os.path.join(tmp, \"scan\")]\nenv[\"GIT_CEILING_DIRECTORIES\"] = os.pathsep.join([ws, tmp])\nmoved = hide_vcs(os.path.join(ws, spec[\"target\"]), os.path.join(tmp, \"vcs\"))\nprint(\"$ \" + \" \".join(cmd), flush=True)\ntry:\n    with open(os.path.join(tmp, \"buildscan.log\"), \"w\", encoding=\"utf-8\") as log:\n        p = subprocess.Popen(cmd, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)\n        for raw in p.stdout:\n            line = raw.decode(\"utf-8\", \"replace\")\n            sys.stdout.write(line)\n            log.write(line)\n        rc = p.wait()\nfinally:\n    restore_vcs(moved)\nwith open(os.path.join(tmp, \"exit_code\"), \"w\") as f:\n    f.write(str(rc))\nprint(\"abis-buildscan exited %d\" % rc, flush=True)\nsys.exit(rc)\n",
            "LD_LIBRARY_PATH": ""
          }
        },
        {
          "name": "Pack the evidence",
          "if": "always()",
          "shell": "python",
          "env": {
            "ABIS_SPEC": "{\"run_id\":\"9f04242d-67cc-4277-b71e-e25a5b4088d6\",\"build_id\":\"fa3262af-a174-4c03-9869-2fec9d2b2017\",\"content_key\":\"5e2f14022d2a7b3913b2c0632de887a589fcb1090bd526cc04c7944fe32e9872\",\"config_name\":\"paperless-ngx-any_noarch-5e2f14022d2a7b3913b2c0632de887a589fcb1090bd526cc04c7944fe32e9872\",\"commit\":\"19fdc3b815cdcaf0ad869557c45c27ef7d2215b3\",\"tree\":\"990be9abe310a01a54ea2d13779aa74a3eef4529\",\"target\":\"paperless-ngx\",\"repo_id\":\"paperless-ngx\",\"repo_name\":\"paperless-ngx\",\"buildscan_sha256\":\"9ca2940256601fb656dddfa1d65938f0981b256b17b0b4501acb07ff280de89d\",\"setup_ids\":[\"u1\",\"u2\",\"u3\",\"u4\",\"abis_prepared_files\"],\"step_names\":{\"u1\":\"Install pnpm\",\"u2\":\"Use Node.js 24\",\"u3\":\"Set up Python\",\"u4\":\"Install uv\",\"abis_prepared_files\":\"measure preparation outputs\"},\"step6_artifacts\":[{\"path\":\"dist/paperless-ngx.tar.xz\",\"bytes\":332505952,\"sha256\":\"8d550dcc87583d7a689e59ce7c85c27bdec0e8d3bdb51d0bf06a7829faf0bc94\",\"pattern\":\"dist/paperless-ngx.tar.xz\"}]}",
            "ABIS_STEPS": "${{ toJSON(steps) }}"
          },
          "run": "import csv, hashlib, json, os, re, shutil, tarfile, zipfile\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\nws = os.environ[\"GITHUB_WORKSPACE\"]\ntmp = os.path.join(os.environ[\"RUNNER_TEMP\"], \"abis\")\nout = os.path.join(tmp, \"out\")\nif os.path.isdir(out):\n    shutil.rmtree(out)\nos.makedirs(os.path.join(out, \"proof\"))\n\n\ndef sha(p):\n    h = hashlib.sha256()\n    with open(p, \"rb\") as f:\n        for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n            h.update(chunk)\n    return h.hexdigest()\n\n\ndef load(p):\n    try:\n        with open(p, encoding=\"utf-8\") as f:\n            return json.load(f)\n    except (OSError, ValueError):\n        return None\n\n\norder = [\"abis_gate\"] + spec[\"setup_ids\"] + [\"abis_prove\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nnames = dict(spec[\"step_names\"], abis_gate=\"the snapshot gate\", abis_prove=\"abis-buildscan\")\n\n\ndef plain(s):\n    \"\"\"Without the terminal colours pwsh writes into a log.\"\"\"\n    return re.sub(r\"\\x1b\\[[0-9;]*[A-Za-z]\", \"\", s) if isinstance(s, str) else s\ntry:\n    with open(os.path.join(tmp, \"exit_code\")) as f:\n        exit_code = int(f.read().strip())\nexcept (OSError, ValueError):\n    exit_code = None\n\nfor name in (\"config.json\", \"steps.json\", \"keep.json\", \"prepared-files.json\"):\n    src = os.path.join(ws, \"abis\", \"proof\", name)\n    if os.path.isfile(src):\n        shutil.copy2(src, os.path.join(out, \"proof\", name))\nfor name in (\"buildscan.log\", \"gate.json\", \"cibw-plan.json\", \"runtime-diagnostics.log\"):\n    src = os.path.join(tmp, name)\n    if os.path.isfile(src):\n        shutil.copy2(src, os.path.join(out, name))\n\n# buildscan writes to <out>/<repo dir>/. The reduced bundle is a copy of\n# snapshot files, so it travels as a manifest, not as bytes; the raw MSBuild\n# tracking logs travel as one zip rather than as hundreds of files.\nscan = os.path.join(tmp, \"scan\")\nrun_dir = None\nif os.path.isdir(scan):\n    run_dir = next((os.path.join(scan, d) for d in sorted(os.listdir(scan))\n                    if os.path.isdir(os.path.join(scan, d))), None)\nlineage = os.path.join(out, \"lineage\")\nos.makedirs(lineage, exist_ok=True)\ntlogs = None\nif run_dir:\n    for dirpath, dirnames, filenames in os.walk(run_dir):\n        if dirpath == run_dir:\n            dirnames[:] = [d for d in dirnames if d not in (\"reduced-bundle\", \"content\")]\n        for fn in filenames:\n            p = os.path.join(dirpath, fn)\n            rel = os.path.relpath(p, run_dir).replace(os.sep, \"/\")\n            if rel.startswith(\"evidence/tlogs/\"):\n                if tlogs is None:\n                    os.makedirs(os.path.join(lineage, \"evidence\"), exist_ok=True)\n                    tlogs = zipfile.ZipFile(os.path.join(lineage, \"evidence\", \"tlogs.zip\"), \"w\", zipfile.ZIP_DEFLATED)\n                tlogs.write(p, rel[len(\"evidence/tlogs/\"):])\n                continue\n            dst = os.path.join(lineage, *rel.split(\"/\"))\n            os.makedirs(os.path.dirname(dst), exist_ok=True)\n            shutil.copy2(p, dst)\nif tlogs is not None:\n    tlogs.close()\n\nkept = None\nbundle = os.path.join(run_dir, \"reduced-bundle\") if run_dir else None\ngiven = set()\nif run_dir:\n    expected = os.path.join(run_dir, \"evidence-verify\", \"expected-files.txt\")\n    if os.path.isfile(expected):\n        with open(expected, encoding=\"utf-8\") as f:\n            listed = [line.strip() for line in f if line.strip()]\n        rows = []\n        for p in listed:\n            here = os.path.isfile(p)\n            rel = os.path.relpath(p, bundle).replace(os.sep, \"/\")\n            given.add(rel.lower())\n            rows.append([rel, sha(p) if here else \"\",\n                         os.path.getsize(p) if here else \"\", \"true\" if here else \"false\"])\n        kept = len(rows)\n        with open(os.path.join(lineage, \"reduced-bundle-manifest.csv\"), \"w\", newline=\"\", encoding=\"utf-8\") as f:\n            w = csv.writer(f)\n            w.writerow([\"path\", \"sha256_after_rebuild\", \"bytes\", \"present\"])\n            w.writerows(sorted(rows))\n\nrid = spec[\"repo_id\"]\nverify = load(os.path.join(lineage, rid + \"-verify-report.json\")) or {}\nstatus = load(os.path.join(lineage, rid + \"-lineage-status.json\")) or {}\nsummary = load(os.path.join(lineage, rid + \"-lineage-summary.json\")) or {}\n\n# By category, because in_build=true covers both what ships (product) and\n# what was kept as declared build infrastructure (build-infra).\ninventory = None\ninv = os.path.join(lineage, rid + \"-lineage-inventory.csv\")\nif os.path.isfile(inv):\n    inventory = {\"rows\": 0, \"categories\": {}}\n    with open(inv, newline=\"\", encoding=\"utf-8\") as f:\n        for r in csv.DictReader(f):\n            inventory[\"rows\"] += 1\n            c = inventory[\"categories\"].setdefault(r.get(\"category\") or \"unknown\", {\"in_build\": 0, \"not_in_build\": 0})\n            c[\"in_build\" if str(r.get(\"in_build\")).lower() == \"true\" else \"not_in_build\"] += 1\n\ndef key(p):\n    return p.replace(\"\\\\\", \"/\").lower()\n\n\ndef bare(h):\n    \"\"\"Manifest §3: bare lowercase hex. buildscan writes 'sha256:<hex>'; anything else is no hash.\"\"\"\n    if not isinstance(h, str):\n        return None\n    h = h.strip().lower()\n    if h.startswith(\"sha256:\"):\n        h = h[len(\"sha256:\"):]\n    return h if len(h) == 64 and all(c in \"0123456789abcdef\" for c in h) else None\n\n\nstep6 = {key(a[\"path\"]): a for a in spec[\"step6_artifacts\"]}\nartifacts, seen = [], set()\nfor rel, a in sorted((verify.get(\"artifacts\") or {}).items()):\n    s6 = step6.get(key(rel))\n    seen.add(key(rel))\n    artifacts.append({\"path\": rel, \"step6_sha256\": bare(s6[\"sha256\"]) if s6 else None,\n                      \"full_sha256\": bare(a.get(\"canonical\")), \"reduced_sha256\": bare(a.get(\"reduced\")),\n                      \"identical\": a.get(\"identical\")})\nfor key, s6 in sorted(step6.items()):\n    if key not in seen:\n        artifacts.append({\"path\": s6[\"path\"], \"step6_sha256\": bare(s6[\"sha256\"]), \"full_sha256\": None,\n                          \"reduced_sha256\": None, \"identical\": None})\n\n# buildscan compares A and B only once the rebuild has built, so a failed\n# rebuild leaves A unrecorded. The traced build's output is still in the\n# checkout (the rebuild ran in the reduced bundle), so A is measured there.\n#\n# B the same way, from the reduced bundle, for an artifact buildscan did not\n# hash: a cibuildwheel cell's buildscan artifacts are the install tree, so the\n# wheel that ships went uncompared (INCIDENTS.md BUG-003, run 5f42f77d). Only\n# after a rebuild that built, and never a file the bundle was given: that is\n# an input, not what the rebuild wrote.\ncheckout = os.path.join(ws, spec[\"target\"])\nrebuilt = verify.get(\"build_ok\") is True and bundle is not None\nfor a in artifacts:\n    a[\"full_from\"] = \"buildscan\" if a[\"full_sha256\"] else None\n    a[\"reduced_from\"] = \"buildscan\" if a[\"reduced_sha256\"] else None\n    p = os.path.join(checkout, *a[\"path\"].split(\"/\"))\n    if a[\"full_sha256\"] is None and exit_code is not None and os.path.isfile(p):\n        a[\"full_sha256\"], a[\"full_from\"] = sha(p), \"checkout\"\n    q = os.path.join(bundle, *a[\"path\"].split(\"/\")) if bundle else None\n    given_to_bundle = a[\"path\"].replace(\"\\\\\", \"/\").lower() in given\n    if a[\"reduced_sha256\"] is None and rebuilt and not given_to_bundle and os.path.isfile(q):\n        a[\"reduced_sha256\"], a[\"reduced_from\"] = sha(q), \"reduced-bundle\"\n    if a[\"identical\"] is None and a[\"full_sha256\"] and a[\"reduced_sha256\"]:\n        a[\"identical\"] = a[\"full_sha256\"] == a[\"reduced_sha256\"]\n\nfiles = []\nfor dirpath, _, filenames in os.walk(out):\n    for fn in filenames:\n        p = os.path.join(dirpath, fn)\n        files.append({\"path\": \"out/\" + os.path.relpath(p, out).replace(os.sep, \"/\"), \"bytes\": os.path.getsize(p)})\nresult = {\n    \"schema\": \"abis-cellproof-result/1\", \"run_id\": spec[\"run_id\"], \"build_id\": spec[\"build_id\"],\n    \"content_key\": spec[\"content_key\"], \"config_name\": spec[\"config_name\"], \"repo_id\": rid,\n    \"steps\": outcomes, \"failed_step\": failed, \"failed_step_name\": names.get(failed) if failed else None,\n    \"exit_code\": exit_code,\n    \"status\": status.get(\"status\"), \"reason\": plain(status.get(\"reason\")), \"rescan\": status.get(\"rescan\"),\n    \"tool\": status.get(\"tool\") or summary.get(\"tool\"),\n    \"verify\": {k: verify.get(k) for k in (\"build_ok\", \"tests_ok\", \"qualified\", \"bit_identical\")},\n    \"verify_error\": plain(verify.get(\"error\") or \"\")[-2000:] or None,\n    \"artifacts\": artifacts,\n    \"counts\": {\"files_total_internal\": summary.get(\"files_total_internal\"),\n               \"files_in_product\": summary.get(\"files_in_product\"),\n               \"files_removed\": summary.get(\"files_removed\"),\n               \"reduced_bundle_files\": kept, \"inventory\": inventory},\n    \"files\": sorted(files, key=lambda f: f[\"path\"]),\n}\nwith open(os.path.join(out, \"result.json\"), \"w\", encoding=\"utf-8\") as f:\n    json.dump(result, f, indent=2)\nwith tarfile.open(os.path.join(tmp, \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps({k: result[k] for k in (\"exit_code\", \"status\", \"verify\", \"artifacts\", \"counts\")}, indent=2))\n"
        },
