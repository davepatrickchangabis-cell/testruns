          "run": "import csv, hashlib, json, os, re, shutil, tarfile, zipfile\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\ntry:\n    steps = json.loads(os.environ.get(\"ABIS_STEPS\") or \"{}\")\nexcept ValueError:\n    steps = {}\nws = os.environ[\"GITHUB_WORKSPACE\"]\ntmp = os.path.join(os.environ[\"RUNNER_TEMP\"], \"abis\")\nout = os.path.join(tmp, \"out\")\nif os.path.isdir(out):\n    shutil.rmtree(out)\nos.makedirs(os.path.join(out, \"proof\"))\n\n\ndef sha(p):\n    h = hashlib.sha256()\n    with open(p, \"rb\") as f:\n        for chunk in iter(lambda: f.read(1 << 20), b\"\"):\n            h.update(chunk)\n    return h.hexdigest()\n\n\ndef load(p):\n    try:\n        with open(p, encoding=\"utf-8\") as f:\n            return json.load(f)\n    except (OSError, ValueError):\n        return None\n\n\norder = [\"abis_gate\"] + spec[\"setup_ids\"] + [\"abis_prove\"]\noutcomes = {i: (steps.get(i) or {}).get(\"outcome\") for i in order}\nfailed = next((i for i in order if outcomes[i] == \"failure\"), None)\nnames = dict(spec[\"step_names\"], abis_gate=\"the snapshot gate\", abis_prove=\"abis-buildscan\")\n\n\ndef plain(s):\n    \"\"\"Without the terminal colours pwsh writes into a log.\"\"\"\n    return re.sub(r\"\\x1b\\[[0-9;]*[A-Za-z]\", \"\", s) if isinstance(s, str) else s\ntry:\n    with open(os.path.join(tmp, \"exit_code\")) as f:\n        exit_code = int(f.read().strip())\nexcept (OSError, ValueError):\n    exit_code = None\n\nfor name in (\"config.json\", \"steps.json\", \"keep.json\"):\n    src = os.path.join(ws, \"abis\", \"proof\", name)\n    if os.path.isfile(src):\n        shutil.copy2(src, os.path.join(out, \"proof\", name))\nfor name in (\"buildscan.log\", \"gate.json\", \"cibw-plan.json\"):\n    src = os.path.join(tmp, name)\n    if os.path.isfile(src):\n        shutil.copy2(src, os.path.join(out, name))\n\n# buildscan writes to <out>/<repo dir>/. The reduced bundle is a copy of\n# snapshot files, so it travels as a manifest, not as bytes; the raw MSBuild\n# tracking logs travel as one zip rather than as hundreds of files.\nscan = os.path.join(tmp, \"scan\")\nrun_dir = None\nif os.path.isdir(scan):\n    run_dir = next((os.path.join(scan, d) for d in sorted(os.listdir(scan))\n                    if os.path.isdir(os.path.join(scan, d))), None)\nlineage = os.path.join(out, \"lineage\")\nos.makedirs(lineage, exist_ok=True)\ntlogs = None\nif run_dir:\n    for dirpath, dirnames, filenames in os.walk(run_dir):\n        if dirpath == run_dir:\n            dirnames[:] = [d for d in dirnames if d not in (\"reduced-bundle\", \"content\")]\n        for fn in filenames:\n            p = os.path.join(dirpath, fn)\n            rel = os.path.relpath(p, run_dir).replace(os.sep, \"/\")\n            if rel.startswith(\"evidence/tlogs/\"):\n                if tlogs is None:\n                    os.makedirs(os.path.join(lineage, \"evidence\"), exist_ok=True)\n                    tlogs = zipfile.ZipFile(os.path.join(lineage, \"evidence\", \"tlogs.zip\"), \"w\", zipfile.ZIP_DEFLATED)\n                tlogs.write(p, rel[len(\"evidence/tlogs/\"):])\n                continue\n            dst = os.path.join(lineage, *rel.split(\"/\"))\n            os.makedirs(os.path.dirname(dst), exist_ok=True)\n            shutil.copy2(p, dst)\nif tlogs is not None:\n    tlogs.close()\n\nkept = None\nbundle = os.path.join(run_dir, \"reduced-bundle\") if run_dir else None\ngiven = set()\nif run_dir:\n    expected = os.path.join(run_dir, \"evidence-verify\", \"expected-files.txt\")\n    if os.path.isfile(expected):\n        with open(expected, encoding=\"utf-8\") as f:\n            listed = [line.strip() for line in f if line.strip()]\n        rows = []\n        for p in listed:\n            here = os.path.isfile(p)\n            rel = os.path.relpath(p, bundle).replace(os.sep, \"/\")\n            given.add(rel.lower())\n            rows.append([rel, sha(p) if here else \"\",\n                         os.path.getsize(p) if here else \"\", \"true\" if here else \"false\"])\n        kept = len(rows)\n        with open(os.path.join(lineage, \"reduced-bundle-manifest.csv\"), \"w\", newline=\"\", encoding=\"utf-8\") as f:\n            w = csv.writer(f)\n            w.writerow([\"path\", \"sha256_after_rebuild\", \"bytes\", \"present\"])\n            w.writerows(sorted(rows))\n\nrid = spec[\"repo_id\"]\nverify = load(os.path.join(lineage, rid + \"-verify-report.json\")) or {}\nstatus = load(os.path.join(lineage, rid + \"-lineage-status.json\")) or {}\nsummary = load(os.path.join(lineage, rid + \"-lineage-summary.json\")) or {}\n\n# By category, because in_build=true covers both what ships (product) and\n# what was kept as declared build infrastructure (build-infra).\ninventory = None\ninv = os.path.join(lineage, rid + \"-lineage-inventory.csv\")\nif os.path.isfile(inv):\n    inventory = {\"rows\": 0, \"categories\": {}}\n    with open(inv, newline=\"\", encoding=\"utf-8\") as f:\n        for r in csv.DictReader(f):\n            inventory[\"rows\"] += 1\n            c = inventory[\"categories\"].setdefault(r.get(\"category\") or \"unknown\", {\"in_build\": 0, \"not_in_build\": 0})\n            c[\"in_build\" if str(r.get(\"in_build\")).lower() == \"true\" else \"not_in_build\"] += 1\n\ndef key(p):\n    return p.replace(\"\\\\\", \"/\").lower()\n\n\ndef bare(h):\n    \"\"\"Manifest §3: bare lowercase hex. buildscan writes 'sha256:<hex>'; anything else is no hash.\"\"\"\n    if not isinstance(h, str):\n        return None\n    h = h.strip().lower()\n    if h.startswith(\"sha256:\"):\n        h = h[len(\"sha256:\"):]\n    return h if len(h) == 64 and all(c in \"0123456789abcdef\" for c in h) else None\n\n\nstep6 = {key(a[\"path\"]): a for a in spec[\"step6_artifacts\"]}\nartifacts, seen = [], set()\nfor rel, a in sorted((verify.get(\"artifacts\") or {}).items()):\n    s6 = step6.get(key(rel))\n    seen.add(key(rel))\n    artifacts.append({\"path\": rel, \"step6_sha256\": bare(s6[\"sha256\"]) if s6 else None,\n                      \"full_sha256\": bare(a.get(\"canonical\")), \"reduced_sha256\": bare(a.get(\"reduced\")),\n                      \"identical\": a.get(\"identical\")})\nfor key, s6 in sorted(step6.items()):\n    if key not in seen:\n        artifacts.append({\"path\": s6[\"path\"], \"step6_sha256\": bare(s6[\"sha256\"]), \"full_sha256\": None,\n                          \"reduced_sha256\": None, \"identical\": None})\n\n# buildscan compares A and B only once the rebuild has built, so a failed\n# rebuild leaves A unrecorded. The traced build's output is still in the\n# checkout (the rebuild ran in the reduced bundle), so A is measured there.\n#\n# B the same way, from the reduced bundle, for an artifact buildscan did not\n# hash: a cibuildwheel cell's buildscan artifacts are the install tree, so the\n# wheel that ships went uncompared (INCIDENTS.md BUG-003, run 5f42f77d). Only\n# after a rebuild that built, and never a file the bundle was given: that is\n# an input, not what the rebuild wrote.\ncheckout = os.path.join(ws, spec[\"target\"])\nrebuilt = verify.get(\"build_ok\") is True and bundle is not None\nfor a in artifacts:\n    a[\"full_from\"] = \"buildscan\" if a[\"full_sha256\"] else None\n    a[\"reduced_from\"] = \"buildscan\" if a[\"reduced_sha256\"] else None\n    p = os.path.join(checkout, *a[\"path\"].split(\"/\"))\n    if a[\"full_sha256\"] is None and exit_code is not None and os.path.isfile(p):\n        a[\"full_sha256\"], a[\"full_from\"] = sha(p), \"checkout\"\n    q = os.path.join(bundle, *a[\"path\"].split(\"/\")) if bundle else None\n    given_to_bundle = a[\"path\"].replace(\"\\\\\", \"/\").lower() in given\n    if a[\"reduced_sha256\"] is None and rebuilt and not given_to_bundle and os.path.isfile(q):\n        a[\"reduced_sha256\"], a[\"reduced_from\"] = sha(q), \"reduced-bundle\"\n    if a[\"identical\"] is None and a[\"full_sha256\"] and a[\"reduced_sha256\"]:\n        a[\"identical\"] = a[\"full_sha256\"] == a[\"reduced_sha256\"]\n\nfiles = []\nfor dirpath, _, filenames in os.walk(out):\n    for fn in filenames:\n        p = os.path.join(dirpath, fn)\n        files.append({\"path\": \"out/\" + os.path.relpath(p, out).replace(os.sep, \"/\"), \"bytes\": os.path.getsize(p)})\nresult = {\n    \"schema\": \"abis-cellproof-result/1\", \"run_id\": spec[\"run_id\"], \"build_id\": spec[\"build_id\"],\n    \"content_key\": spec[\"content_key\"], \"config_name\": spec[\"config_name\"], \"repo_id\": rid,\n    \"steps\": outcomes, \"failed_step\": failed, \"failed_step_name\": names.get(failed) if failed else None,\n    \"exit_code\": exit_code,\n    \"status\": status.get(\"status\"), \"reason\": plain(status.get(\"reason\")), \"rescan\": status.get(\"rescan\"),\n    \"tool\": status.get(\"tool\") or summary.get(\"tool\"),\n    \"verify\": {k: verify.get(k) for k in (\"build_ok\", \"tests_ok\", \"qualified\", \"bit_identical\")},\n    \"verify_error\": plain(verify.get(\"error\") or \"\")[-2000:] or None,\n    \"artifacts\": artifacts,\n    \"counts\": {\"files_total_internal\": summary.get(\"files_total_internal\"),\n               \"files_in_product\": summary.get(\"files_in_product\"),\n               \"files_removed\": summary.get(\"files_removed\"),\n               \"reduced_bundle_files\": kept, \"inventory\": inventory},\n    \"files\": sorted(files, key=lambda f: f[\"path\"]),\n}\nwith open(os.path.join(out, \"result.json\"), \"w\", encoding=\"utf-8\") as f:\n    json.dump(result, f, indent=2)\nwith tarfile.open(os.path.join(tmp, \"bundle.tar.gz\"), \"w:gz\") as t:\n    t.add(out, arcname=\"out\")\nprint(json.dumps({k: result[k] for k in (\"exit_code\", \"status\", \"verify\", \"artifacts\", \"counts\")}, indent=2))\n"
        },
