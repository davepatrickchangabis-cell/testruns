            "ABIS_SCANNER_SCRIPT": "import json, os, shutil, subprocess, sys\nfor stream in (sys.stdout, sys.stderr):\n    stream.reconfigure(encoding=\"utf-8\", errors=\"replace\")\nspec = json.loads(os.environ[\"ABIS_SPEC\"])\nws = os.environ[\"GITHUB_WORKSPACE\"]\ntmp = os.path.join(os.environ[\"RUNNER_TEMP\"], \"abis\")\nos.makedirs(tmp, exist_ok=True)\nproof = os.path.join(ws, \"abis\", \"proof\")\nenv = dict(os.environ)\n# The scanner must not choose the interpreter that runs the proven recipe.\n# Its setup action deliberately leaves the job environment alone; a recipe\n# setup action may then select its own Python.  This outer process stays the\n# pinned scanner Python while the recipe uses the selected Python executable.\nrecipe_python = shutil.which(\"python\") or sys.executable\n# setup-python can add its lib directory after this workflow was rendered.\n# Do not let that override the runner's C++ runtime while NumPy loads an\n# extension.  Pop here as well as on the workflow step: this is the exact\n# environment inherited by buildscan and the recipe driver.\nenv.pop(\"LD_LIBRARY_PATH\", None)\n# ABIS_PYTHON is called for both build and test phases.  Put a transparent\n# driver in front of it so a failed native import retains the interpreter,\n# loader variables, and actual library resolution in the evidence bundle.\n# ldd runs only on an extension the build has already written; it does not\n# execute the extension.  This is needed because an empty LD_LIBRARY_PATH did\n# not, by itself, identify the libstdc++ which supplied NumPy's missing ABI.\nruntime_driver = os.path.join(proof, \"runtime-driver.py\")\nwith open(runtime_driver, \"w\", encoding=\"utf-8\") as f:\n    f.write(r'''#! /usr/bin/env python3\nimport glob, os, subprocess, sys\nlog = os.environ[\"ABIS_RUNTIME_LOG\"]\nreal = os.environ[\"ABIS_RECIPE_PYTHON\"]\nwith open(log, \"a\", encoding=\"utf-8\") as out:\n    def record(args, contains=None):\n        out.write(\"[runtime] \" + \" \".join(args) + \"\\\\n\")\n        try:\n            p = subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)\n        except OSError as e:\n            out.write(\"[runtime] could not run: \" + str(e) + \"\\\\n\")\n            return\n        lines = p.stdout.splitlines()\n        if contains is not None:\n            lines = [line for line in lines if contains in line]\n            if not lines:\n                out.write(\"[runtime] no output containing \" + contains + \"\\\\n\")\n        out.write(\"\\\\n\".join(lines) + (\"\\\\n\" if lines else \"\"))\n        out.write(\"[runtime] exit=\" + str(p.returncode) + \"\\\\n\")\n\n    out.write(\"[runtime] executable=\" + real + \"\\\\n\")\n    out.write(\"[runtime] argv=\" + repr(sys.argv[1:]) + \"\\\\n\")\n    for name in (\"LD_LIBRARY_PATH\", \"LD_PRELOAD\", \"PATH\"):\n        out.write(\"[runtime] \" + name + \"=\" + os.environ.get(name, \"\") + \"\\\\n\")\n    for ext in sorted(glob.glob(os.path.join(os.getcwd(), \"build-install\", \"**\", \"_multiarray_umath*.so\"), recursive=True)):\n        record([\"readelf\", \"-d\", ext])\n        record([\"readelf\", \"-Ws\", ext], \"__si_class_type_info\")\n        record([\"ldd\", ext])\n    build_dir = os.path.join(os.getcwd(), \"build\")\n    if os.path.isdir(build_dir):\n        record([\"ninja\", \"-C\", build_dir, \"-t\", \"commands\"], \"_multiarray_umath\")\nos.execvpe(real, [real, *sys.argv[1:]], os.environ)\n''')\nos.chmod(runtime_driver, 0o755)\nenv.update({\"ABIS_PYTHON\": runtime_driver, \"ABIS_RECIPE_PYTHON\": recipe_python,\n            \"ABIS_RUNTIME_LOG\": os.path.join(tmp, \"runtime-diagnostics.log\"),\n            \"ABIS_RECIPE\": os.path.join(proof, \"recipe.py\"),\n            \"ABIS_RECIPE_STEPS\": os.path.join(proof, \"steps.json\"),\n            \"LINEAGE_PREPARED_FILES\": os.path.join(proof, \"prepared-files.json\"),\n            \"PYTHONIOENCODING\": \"utf-8\"})\ncmd = [sys.executable, os.path.join(ws, \"abis\", \"bin\", \"abis-buildscan.pyz\"),\n       \"--repo\", os.path.join(ws, spec[\"target\"]), \"--repo-id\", spec[\"repo_id\"],\n       \"--repo-name\", spec[\"repo_name\"], \"--config-name\", spec[\"config_name\"],\n       \"--external-config\", os.path.join(proof, \"config.json\"),\n       \"--commit\", spec[\"commit\"], \"--no-cache\", \"--out\", os.path.join(tmp, \"scan\")]\nprint(\"$ \" + \" \".join(cmd), flush=True)\nwith open(os.path.join(tmp, \"buildscan.log\"), \"w\", encoding=\"utf-8\") as log:\n    p = subprocess.Popen(cmd, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)\n    for raw in p.stdout:\n        line = raw.decode(\"utf-8\", \"replace\")\n        sys.stdout.write(line)\n        log.write(line)\n    rc = p.wait()\nwith open(os.path.join(tmp, \"exit_code\"), \"w\") as f:\n    f.write(str(rc))\nprint(\"abis-buildscan exited %d\" % rc, flush=True)\nsys.exit(rc)\n",
